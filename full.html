  {Variable:'qc_fast_completion_flag',Description:'Data-quality flag: TRUE if total duration was under 3 minutes, which is implausibly fast for this ~15\u201320 minute survey and likely indicates a rushed/careless response',Range:'TRUE / FALSE'},
  {Variable:'qc_anticipatory_response_flag',Description:'Data-quality flag: TRUE if 2+ button presses on the n-back task were under 150ms, which is faster than a genuine human reaction to a stimulus \u2014 suggests button-mashing rather than real responses',Range:'TRUE / FALSE'},
  {Variable:'qc_straight_lining_flag',Description:'Data-quality flag: TRUE if the participant gave the exact same answer to all 9 PSQI sleep-disturbance sub-items \u2014 a classic satisficing/inattentive-responding pattern',Range:'TRUE / FALSE'},
  {Variable:'qc_time_inconsistent_flag',Description:'Data-quality flag: TRUE if reported sleep duration (psqi_q4_duration band) is logically impossible given time actually spent in bed (psqi_q3_waketime minus psqi_q1_bedtime) \u2014 e.g. claiming 7+ hours of sleep from only 90 minutes in bed',Range:'TRUE / FALSE'},
  {Variable:'qc_nb_no_response_flag',Description:'Data-quality flag: TRUE if the participant made zero button presses across the entire real n-back test \u2014 the classic case a raw d\u2032 score can mask, since a fully-blank run still lands near the low end of the d\u2032 scale rather than reading as invalid. This flag catches it directly',Range:'TRUE / FALSE'},
  {Variable:'qc_nb_faded_out_flag',Description:'Data-quality flag: TRUE if the participant responded during the first half of the n-back test but made zero responses in the entire second half \u2014 suggests attention dropped out partway through rather than reflecting genuine ability the whole way',Range:'TRUE / FALSE'},
  {Variable:'qc_nb_over_response_flag',Description:'Data-quality flag: TRUE if the participant pressed the button on ~85% or more of all n-back trials \u2014 suggests indiscriminate button-mashing rather than actually judging each letter',Range:'TRUE / FALSE'},
  {Variable:'qc_nb_distracted_flag',Description:'Data-quality flag: TRUE if the browser tab/window lost focus for 2+ seconds total during the real n-back test (e.g. switched to another tab or app) \u2014 see qc_nb_blur_count / qc_nb_blur_ms for detail',Range:'TRUE / FALSE'},
  {Variable:'qc_nb_rt_flat_flag',Description:'Data-quality flag: TRUE if the participant had 4+ correct n-back hits and the reaction times across those hits had almost no variance (standard deviation under 20ms) \u2014 real human reflexes essentially never land that consistently; suggests scripted/robotic responses rather than genuine ones',Range:'TRUE / FALSE'},
  {Variable:'qc_nb_blur_count',Description:'Number of times the browser tab/window lost focus during the real n-back test',Range:'count'},
  {Variable:'qc_nb_blur_ms',Description:'Total milliseconds the browser tab/window was unfocused during the real n-back test',Range:'milliseconds'},
  {Variable:'qc_honeypot_flag',Description:'Data-quality flag: TRUE if a hidden form field \u2014 invisible and unreachable for a real person, but often auto-filled by a script that blindly fills every input on the page \u2014 was filled in. Near-certain sign of a bot/automated submission rather than a real participant',Range:'TRUE / FALSE'},
  {Variable:'qc_instant_click_flag',Description:'Data-quality flag: TRUE if the very first click on the page landed under 400ms after the page loaded \u2014 not enough time for a human to have read anything first; suggests a script driving the page rather than a person',Range:'TRUE / FALSE'},
  {Variable:'qc_first_interaction_ms',Description:'Milliseconds between page load and the participant first click anywhere on the page. Very low values pair with qc_instant_click_flag; kept as a raw number here for review',Range:'milliseconds'},
  {Variable:'qc_duplicate_suspect_flag',Description:'Data-quality flag: TRUE if this submission\u2019s hashed IP address AND device fingerprint (see qc_ip_hash) both match another row in the dataset under a different participant ID \u2014 suggests the same person/device submitted more than once (e.g. retook the survey in a new private/incognito window). Matching IP alone does NOT trigger this, since many genuine participants can share a network (e.g. a classroom) \u2014 only fires when both signals agree',Range:'TRUE / FALSE'},
  {Variable:'qc_ip_hash',Description:'A one-way salted hash of the submitting IP address, computed server-side. The raw IP is never stored anywhere \u2014 this hash only exists so qc_duplicate_suspect_flag can be computed, and so you can manually spot-check clusters of submissions from the same network if needed',Range:'hex string'},
  {Variable:'qc_honesty_self_report',Description:'Self-reported at the very end, after the participant already saw their results and their response was already saved (so there is no incentive to answer dishonestly to change a score): careful = reported paying full attention throughout; rushed = self-reported rushing or clicking through part of the survey (this also sets qc_exclude_recommended); prefer_not = declined to answer; blank = never reached/answered this question',Range:'careful / rushed / prefer_not / blank'},
  {Variable:'qc_fatigue_rating',Description:'Self-reported task difficulty/fatigue immediately after the n-back task, 1=very easy to 5=very hard. Useful for distinguishing low performance due to genuine difficulty vs. disengagement',Range:'1\u20135 or blank'},
  {Variable:'qc_exclude_recommended',Description:'Composite flag: TRUE if ANY quality-control check failed (fast completion, anticipatory responses, straight-lining, time inconsistency, failed attention check, or any n-back engagement check: no-response, faded-out, over-response, tab-switch/distracted). Not an automatic exclusion \u2014 a flag for manual review before finalizing your analysis sample',Range:'TRUE / FALSE'},
  {Variable:'app_version',Description:'Version of the survey app the response was collected on \u2014 check this if you change questions or scoring mid-collection, so you can separate data collected under different versions',Range:'semver text'},
  {Variable:'local_hour',Description:'Participant\u2019s local hour of day (0\u201323) when they completed the survey \u2014 useful for checking circadian/time-of-day effects on sleep and working-memory measures',Range:'0\u201323'},
  {Variable:'preview_row',Description:'TRUE if this row was collected in researcher preview mode (?preview=1) and should be excluded from any real analysis \u2014 in practice preview rows are not saved to the shared dataset at all, this column exists only as a safety net',Range:'TRUE / FALSE'},
  {Variable:'device_type',Description:'Device category detected from the browser at submission time',Range:'mobile / tablet / desktop'},
  {Variable:'browser',Description:'Browser detected at submission time',Range:'chrome / safari / firefox / edge / other'},
  {Variable:'screen_w / screen_h',Description:'Participant\u2019s physical screen resolution in pixels \u2014 a very small screen may affect n-back task legibility/performance',Range:'pixels'},
  {Variable:'viewport_w',Description:'Browser viewport width in pixels at submission time (may differ from screen_w on desktop windowed browsers)',Range:'pixels'},
  {Variable:'timezone',Description:'Participant\u2019s browser-reported IANA timezone (e.g. Asia/Tashkent)',Range:'text'},
  {Variable:'ctx_sleep_last_night',Description:'Optional self-report: hours slept the night before taking the survey \u2014 a same-day sleep confound distinct from the PSQI\u2019s past-month average',Range:'lt5 / 5to7 / gt7 / blank (optional)'},
  {Variable:'ctx_caffeine_today',Description:'Optional self-report: any caffeine (tea/coffee/energy drink) consumed the day of testing \u2014 a known confound for reaction-time and working-memory tasks',Range:'ha / yoq / blank (optional)'},
  {Variable:'ctx_regular_medication',Description:'Optional self-report: currently taking any regular medication (unspecified which) \u2014 flagged only as yes/no for privacy, not itemized',Range:'ha / yoq / blank (optional)'},
  {Variable:'nback_n_targets / nback_n_nontargets',Description:'Actual count of target (2-back match) vs. non-target trials this participant\u2019s randomly generated sequence contained. The generator targets ~34% match rate but check these columns \u2014 an unbalanced sequence (e.g. very few targets) makes that participant\u2019s d\u2032 less reliable',Range:'counts, sum to 22'},
  {Variable:'nback_target_ratio',Description:'nback_n_targets / total trials for this participant, as a proportion \u2014 quick way to spot sequences that came out badly unbalanced by chance',Range:'0\u20131, expect \u2248 0.30\u20130.40'},
  {Variable:'MISSING VALUES \u2014 read this',Description:'Unanswered optional items (ctx_* fields, qc_fatigue_rating) are blank/null in the export, not zero \u2014 treat as genuinely missing (NA), not as a meaningful "0" response. Required survey items cannot be left blank by design (the app validates before allowing continue), so blanks there would indicate a data export issue, not a real participant skip.',Range:'\u2014'},
];
function dlXLSX(rows){
  if(!rows.length){toast('No data','var(--red)');return;}
  try{
    const flat=rows.map(flattenRow);
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(flat);
    // column widths
    ws['!cols']=Object.keys(flat[0]).map(k=>({wch:Math.max(k.length,12)}));
    XLSX.utils.book_append_sheet(wb,ws,'Survey Data');
    // Info / codebook sheet \u2014 every exported column, explained
    const wsInfo=XLSX.utils.json_to_sheet(CODEBOOK);
    wsInfo['!cols']=[{wch:26},{wch:70},{wch:16}];
    XLSX.utils.book_append_sheet(wb,wsInfo,'Codebook');
    XLSX.writeFile(wb,'survey_data.xlsx');
  }catch(e){toast('XLSX error: '+e.message,'var(--red)');}
}
function dlCSV(rows){
  if(!rows.length){toast('No data','var(--red)');return;}
  const flat=rows.map(flattenRow);
  const h=Object.keys(flat[0]);
  const csv=[h.join(','),...flat.map(r=>h.map(k=>`"${(r[k]??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  dl(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),'survey_data.csv');
}
function dlJSON(rows){dl(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}),'survey_data.json');}
async function dlZIP(rows){
  if(!rows.length){toast('No data','var(--red)');return;}
  try{
    const zip=new JSZip();
    const flat=rows.map(flattenRow);
    const h=Object.keys(flat[0]);
    const csv=[h.join(','),...flat.map(r=>h.map(k=>`"${(r[k]??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
    zip.file('survey_data.csv','\uFEFF'+csv);
    zip.file('survey_data.json',JSON.stringify(rows,null,2));
    const codebookTxt=CODEBOOK.map(c=>`${c.Variable}\n  Range: ${c.Range}\n  ${c.Description}\n`).join('\n');
    zip.file('codebook.txt',
      'CODEBOOK \u2014 Migraine, Sleep & Memory Survey\nGenerated: '+new Date().toISOString()+'\nTotal rows: '+rows.length+'\n\n'+codebookTxt
    );
    zip.file('README.txt',
      'This ZIP contains the full exported dataset for the Migraine, Sleep & Memory survey.\n\n'+
      '- survey_data.csv / survey_data.json: one row per participant, every question included.\n'+
      '- codebook.txt: what every column means, its valid range, and any scoring notes.\n\n'+
      'Data-quality columns (qc_*) flag rows worth a second look before analysis \u2014 see codebook.txt for details.\n'
    );
    const blob=await zip.generateAsync({type:'blob'});
    dl(blob,'survey_data_bundle.zip');
  }catch(e){toast('ZIP error: '+e.message,'var(--red)');}
}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);}

// ═══ RENDER ════════════════════════════════════════════════════════════════
function saveDraft(){
  if(S.step<=0||S.step>=7)return; // nothing meaningful to resume before step 1 or once the memory task starts
  try{
    localStorage.setItem('tadqiqot_draft',JSON.stringify({
      step:S.step,demo:S.demo,migraine:S.migraine,psqi:S.psqi,lang:LANG,t0:S.t0,savedAt:Date.now()
    }));
  }catch(e){}
}
function clearDraft(){try{localStorage.removeItem('tadqiqot_draft');}catch(e){}}
function showResumePrompt(draft){
  const mins=Math.max(1,Math.round((Date.now()-(draft.savedAt||Date.now()))/60000));
  const timeAgo=mins<60
    ?(LANG==='en'?`${mins} min ago`:LANG==='ru'?`${mins} мин назад`:`${mins} daqiqa oldin`)
    :(LANG==='en'?`${Math.round(mins/60)}h ago`:LANG==='ru'?`${Math.round(mins/60)} ч назад`:`${Math.round(mins/60)} soat oldin`);
  app.innerHTML=`<div class="screen active"><div class="card"><div class="card-inner" style="text-align:center;padding:38px 22px;">
    <div style="font-size:50px;margin-bottom:14px;">👋</div>
    <h2 style="margin-bottom:10px;">${LANG==='en'?'Welcome back!':LANG==='ru'?'С возвращением!':'Xush kelibsiz!'}</h2>
    <p style="max-width:360px;margin:0 auto;">${LANG==='en'?`You have an unfinished survey from ${timeAgo}. Continue where you left off?`:LANG==='ru'?`У вас есть незавершённый опрос (${timeAgo}). Продолжить с того места, где остановились?`:`Sizda tugallanmagan so'rovnoma bor (${timeAgo}). Qoldirgan joyingizdan davom etasizmi?`}</p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;">
      <button class="btn btn-ghost" onclick="discardDraftAndStart()">${LANG==='en'?'Start over':LANG==='ru'?'Начать заново':'Qaytadan boshlash'}</button>
      <button class="btn btn-primary" onclick="resumeDraft()">${LANG==='en'?'Continue →':LANG==='ru'?'Продолжить →':'Davom etish →'}</button>
    </div>
  </div></div></div>`;
  window.scrollTo(0,0);
}
function resumeDraft(){
  try{
    const raw=localStorage.getItem('tadqiqot_draft');
    if(raw){
      const d=JSON.parse(raw);
      S.demo=d.demo||{};S.migraine=d.migraine||{};S.psqi=d.psqi||{};
      S.step=Math.min(Math.max(d.step||1,1),6);
      S.t0=d.t0||Date.now();
      if(d.lang&&['uz','ru','en'].includes(d.lang)){
        LANG=d.lang;
        ['uz','ru','en'].forEach(x=>{const el=document.getElementById('lo-'+x);if(el)el.classList.toggle('active',x===d.lang);});
      }
    }
  }catch(e){}
  render();
}
function discardDraftAndStart(){
  clearDraft();
  S.step=0;render();
}
function pinTop(){
  // Force the window back to the top. Called more than once on purpose \u2014
  // this is a defensive net against any late layout shift (wheel positioning,
  // web-font swap, mobile reflow) that might otherwise nudge the scroll position
  // after the initial jump-to-top already happened.
  window.scrollTo(0,0);
}
function render(){
  movePill(LANG);
  const steps=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9];
  if(S.step===7){s7();setTimeout(()=>{if(nbSeq.length>0&&nbIdx===0)runTrial();},160);}
  else if(steps[S.step])steps[S.step]();
  saveDraft();
  pinTop();
  requestAnimationFrame(()=>{pinTop();requestAnimationFrame(pinTop);});
  setTimeout(pinTop,60);
  setTimeout(pinTop,180);
  setTimeout(pinTop,400);
}
let ALREADY_DONE=false;
try{ALREADY_DONE=localStorage.getItem('tadqiqot_done')==='1';}catch(e){}
let RESUME_DRAFT=null;
try{const raw=localStorage.getItem('tadqiqot_draft');if(raw)RESUME_DRAFT=JSON.parse(raw);}catch(e){}

async function stillHasSavedData(){
  // Returns true if we should KEEP the block in place (data confirmed present, or we
  // genuinely can't tell). Only returns false \u2014 unlocking them \u2014 when the server
  // explicitly and successfully confirms their original response no longer exists,
  // e.g. after a sync outage wiped it. Fails safe: any uncertainty keeps the block.
  let storedPid=null;
  try{storedPid=localStorage.getItem('tadqiqot_done_pid');}catch(e){}
  if(!storedPid)return true; // no pid on record (older completion, or local-only save) \u2014 can't verify, stay safe
  try{
    const res=await fetch(apiUrl('/api/exists/'+encodeURIComponent(storedPid)),{cache:'no-store'});
    if(!res.ok)return true;
    const j=await res.json();
    return !(j&&j.exists===false);
  }catch(e){
    return true; // couldn't reach the server \u2014 stay conservative, don't unlock on a network hiccup
  }
}

(async function boot(){
  if(PREVIEW_MODE){
    const b=document.createElement('div');
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999;background:var(--accent2);color:#1a0a10;text-align:center;font-family:var(--font-display);font-weight:700;font-size:12px;padding:5px;';
    b.textContent='👁️ '+(LANG==='en'?'PREVIEW MODE \u2014 nothing you do here is saved':"KO'RIB CHIQISH REJIMI \u2014 hech narsa saqlanmaydi");
    document.body.prepend(b);
    render();
    return;
  }
  if(ALREADY_DONE){
    const keepBlocked=await stillHasSavedData();
    if(keepBlocked){sBlocked('repeat');return;}
    // Confirmed gone server-side \u2014 clear the stale local lock and let them back in.
    try{localStorage.removeItem('tadqiqot_done');localStorage.removeItem('tadqiqot_done_pid');}catch(e){}
    ALREADY_DONE=false;
  }
  if(RESUME_DRAFT&&RESUME_DRAFT.step>0){showResumePrompt(RESUME_DRAFT);}
  else{render();}
})();
</script>
