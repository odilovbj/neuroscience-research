<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Migraine, Sleep & Memory — Scientific Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#03100c;
  --g1:rgba(16,185,129,0.5);--g2:rgba(6,182,212,0.4);--g3:rgba(59,130,246,0.32);
  --glass:rgba(255,255,255,0.085);--glass2:rgba(255,255,255,0.13);--glass3:rgba(255,255,255,0.18);
  --border:rgba(255,255,255,0.18);--border2:rgba(255,255,255,0.28);
  --text:#ffffff;--sub:rgba(255,255,255,0.94);--muted:rgba(255,255,255,0.8);--muted2:rgba(255,255,255,0.62);
  --accent:#10b981;--accent2:#06b6d4;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--violet:#a78bfa;--rose:#fb7185;
  --r:20px;
  --font-display:'Lexend',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --edge-shadow:0 1px 2px rgba(0,0,0,.45),0 1px 14px rgba(0,0,0,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;overflow-anchor:none;}
html{scroll-behavior:smooth;overflow-anchor:none;}
body{font-family:var(--font-body);color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-shadow:var(--edge-shadow);overflow-anchor:none;}

/* ── BG ── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform;}
.o1{width:800px;height:800px;background:var(--g1);top:-20%;left:-20%;opacity:.7;animation:fl1 26s ease-in-out infinite;}
.o2{width:700px;height:700px;background:var(--g2);bottom:-25%;right:-20%;opacity:.65;animation:fl2 32s ease-in-out infinite;}
.o3{width:500px;height:500px;background:var(--g3);top:35%;left:42%;opacity:.5;animation:fl3 22s ease-in-out infinite;}
.o4{width:400px;height:400px;background:rgba(167,243,208,0.25);top:20%;right:10%;opacity:.4;animation:fl2 18s ease-in-out infinite reverse;}
@keyframes fl1{0%,100%{transform:translate(0,0);}50%{transform:translate(80px,-60px);}}
@keyframes fl2{0%,100%{transform:translate(0,0);}50%{transform:translate(-70px,70px);}}
@keyframes fl3{0%,100%{transform:translate(0,0);}50%{transform:translate(50px,50px);}}

/* SVG distortion filter (hidden) */
.svg-defs{position:absolute;width:0;height:0;pointer-events:none;}

/* ── LAYOUT ── */
#app{position:relative;z-index:10;max-width:640px;margin:0 auto;padding:58px 14px 90px;overflow-anchor:none;}

/* ── PROGRESS ── */
.pbar-shell{position:fixed;top:0;left:0;right:0;z-index:300;height:3px;background:rgba(255,255,255,0.04);}
.pbar{height:100%;background:linear-gradient(90deg,#10b981,#06b6d4,#60a5fa,#10b981);background-size:300%;animation:shim 4s linear infinite;transition:width .5s ease;}
@keyframes shim{to{background-position:300%;}}
.pbar-meta{position:fixed;top:8px;left:0;right:0;z-index:300;display:flex;justify-content:space-between;align-items:center;padding:0 14px;pointer-events:none;}
.pbar-pill{background:rgba(0,0,0,.6);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.32);border-radius:100px;padding:5px 12px;font-size:11px;font-weight:700;color:var(--text);letter-spacing:.04em;font-family:var(--font-display);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.pbar-pct{color:var(--accent);font-size:11px;font-weight:700;}

/* ── LANG SWITCHER ── */
.lang-switch{
  position:fixed;top:7px;left:50%;transform:translateX(-50%);z-index:400;
  background:rgba(0,0,0,.45);backdrop-filter:blur(24px) saturate(150%);
  border:1px solid var(--border2);border-radius:100px;
  padding:3px;display:flex;align-items:center;
  pointer-events:all;transition:opacity .4s,transform .4s;
}
.lang-switch.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-10px);}
.lang-opt{position:relative;z-index:2;padding:5px 13px;border-radius:100px;font-size:11.5px;font-weight:700;color:var(--muted2);cursor:pointer;transition:color .25s;white-space:nowrap;display:flex;align-items:center;gap:5px;user-select:none;}
.lang-opt.active{color:#03100c;}
.lang-pill{position:absolute;top:3px;bottom:3px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:100px;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);z-index:1;box-shadow:0 2px 12px rgba(16,185,129,.45);}

/* ── TRUE LIQUID GLASS CARD ── */
.card{
  position:relative;
  background:
    linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.055) 44%,rgba(255,255,255,.105)),
    radial-gradient(circle at 18% 0%,rgba(255,255,255,.25),transparent 28%),
    rgba(255,255,255,0.078);
  backdrop-filter:blur(34px) saturate(210%) contrast(1.04) brightness(1.08) url(#liquid-refraction);
  -webkit-backdrop-filter:blur(34px) saturate(210%) contrast(1.04) brightness(1.08);
  border:1px solid rgba(255,255,255,0.3);
  border-top-color:rgba(255,255,255,0.52);
  border-radius:var(--r);
  box-shadow:0 28px 70px rgba(0,0,0,.38),0 4px 18px rgba(16,185,129,.08),inset 0 1px 0 rgba(255,255,255,.48),inset 0 -1px 0 rgba(255,255,255,.08);
  padding:28px 24px;
  margin-bottom:14px;
  overflow:hidden;
  isolation:isolate;
}
.card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);z-index:1;}
.card::after{content:'';position:absolute;inset:1px;border-radius:calc(var(--r) - 1px);background:linear-gradient(145deg,rgba(255,255,255,.1) 0%,transparent 38%,rgba(167,139,250,.055) 62%,rgba(6,182,212,.06) 100%);pointer-events:none;box-shadow:inset 0 0 28px rgba(255,255,255,.055);}
.card-inner{position:relative;z-index:2;}
.rule-panel{background:rgba(3,16,12,.3);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.1);}

/* ── TYPOGRAPHY ── */
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7cf5c4;background:rgba(3,16,12,.55);border:1px solid rgba(52,211,153,.6);padding:6px 13px;border-radius:100px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);text-shadow:0 0 10px rgba(16,185,129,.7);font-family:var(--font-display);}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
h1,h2,h3{font-family:var(--font-display);}
h1{font-size:clamp(1.9rem,7vw,3rem);font-weight:800;letter-spacing:-.035em;line-height:1.08;text-shadow:0 2px 18px rgba(0,0,0,.35);}
h1 .grad{background:linear-gradient(135deg,#6ee7b7,#22d3ee,#86efac);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(16,185,129,.25));}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1.25;color:var(--text);text-shadow:0 1px 12px rgba(0,0,0,.3);}
h3{font-size:1.05rem;font-weight:600;color:var(--text);}
p{color:var(--sub);line-height:1.7;font-size:.98rem;}
.muted2{color:var(--muted2);font-size:.83rem;}
.qs{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;margin-top:22px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
.qs:first-of-type,.qs.first{margin-top:0;}
.qs-icon{font-size:18px;flex-shrink:0;margin-top:1px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 28px;border-radius:100px;border:none;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-.01em;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.86));color:#04180e;box-shadow:0 8px 28px rgba(16,185,129,.28),inset 0 1px 0 rgba(255,255,255,.5);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(16,185,129,.4);}
.btn-primary:active{transform:scale(.98);}
.btn-ghost{background:rgba(255,255,255,.09);border:1px solid var(--border2);color:var(--muted);backdrop-filter:blur(16px);}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.36);}
.btn-full{width:100%;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;}
.brow{display:flex;gap:10px;margin-top:22px;justify-content:space-between;flex-wrap:wrap;}

/* ── SCREENS ── */
.screen{display:none;}
.screen.active{display:block;animation:sIn .45s cubic-bezier(.34,1.15,.64,1);}
@keyframes sIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* ── HERO ── */
.hero{text-align:center;padding:50px 0 26px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 19px;border-radius:100px;background:rgba(3,16,12,.55);border:1.5px solid rgba(52,211,153,.65);font-size:12px;font-weight:800;color:#7cf5c4;letter-spacing:.05em;margin-bottom:20px;text-shadow:0 0 10px rgba(16,185,129,.7);box-shadow:0 3px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);font-family:var(--font-display);}
.hero-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7);}70%{box-shadow:0 0 0 10px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.info-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:14px;padding:13px 14px;}
.info-icon{width:38px;height:38px;border-radius:10px;background:rgba(16,185,129,.14);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.info-lbl{font-size:10px;color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.info-val{font-size:13.5px;font-weight:600;color:var(--text);margin-top:2px;}
.contact-bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.contact-chip{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:11px;background:rgba(3,16,12,.34);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:500;color:var(--muted);overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.1);}
.c-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.c-ico svg{width:17px;height:17px;}
.c-ico.mail{background:rgba(16,185,129,.18);border:1px solid rgba(52,211,153,.4);color:#6ee7b7;}
.c-ico.tg{background:rgba(96,165,250,.18);border:1px solid rgba(96,165,250,.45);color:#60a5fa;}
.contact-chip>div{min-width:0;}
.contact-chip a{color:var(--accent);text-decoration:none;font-weight:600;overflow-wrap:anywhere;word-break:break-word;}

/* ── NUMBER GRID ── */
.num-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;}
.num-chip{min-width:58px;height:56px;border-radius:14px;background:rgba(3,16,12,.34);border:1px solid rgba(255,255,255,.32);box-shadow:0 3px 10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--text);cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);gap:2px;padding:0 10px;}
.num-chip small{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--muted2);}
.num-chip:hover{background:rgba(3,16,12,.22);border-color:rgba(255,255,255,.42);transform:translateY(-2px);}
.num-chip.selected{background:linear-gradient(135deg,rgba(16,185,129,.34),rgba(6,182,212,.22));border-color:var(--accent);box-shadow:0 6px 20px rgba(16,185,129,.32);transform:translateY(-2px);}
.num-chip.selected small{color:var(--accent);}

/* ── OPTIONS ── */
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:center;gap:13px;background:rgba(3,16,12,.34);border:1px solid rgba(255,255,255,.32);border-bottom-width:2px;border-radius:15px;padding:14px 16px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);box-shadow:0 3px 10px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.1);}
.opt:hover{background:rgba(3,16,12,.22);border-color:rgba(255,255,255,.42);transform:translateY(-1px);}
.opt.selected{background:linear-gradient(135deg,rgba(16,185,129,.26),rgba(6,182,212,.16));border-color:rgba(16,185,129,.6);box-shadow:0 6px 22px rgba(16,185,129,.28);}
.opt-ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;transition:transform .22s;}
.opt:hover .opt-ico{transform:scale(1.1) rotate(-6deg);}
.opt.selected .opt-ico{background:rgba(16,185,129,.24);}
.opt-txt{flex:1;font-size:15px;font-weight:500;color:var(--sub);}
.opt.selected .opt-txt{color:var(--text);font-weight:600;}
.opt-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .18s;flex-shrink:0;}
.opt.selected .opt-chk{background:var(--accent);border-color:var(--accent);color:#04180e;}

/* ── PILLS ── */
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
.pill{background:rgba(3,16,12,.34);border:1px solid rgba(255,255,255,.32);border-bottom-width:3px;border-radius:17px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1);box-shadow:0 3px 10px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.1);}
.pill:hover{background:rgba(3,16,12,.22);border-color:rgba(255,255,255,.42);transform:translateY(-3px);}
.pill-ico{font-size:34px;display:block;margin-bottom:9px;transition:transform .28s;}
.pill:hover .pill-ico{transform:scale(1.18) rotate(-5deg);}
.pill-lbl{font-size:15px;font-weight:600;color:var(--sub);}
.pill.selected{background:linear-gradient(180deg,rgba(16,185,129,.3),rgba(6,182,212,.18));border-color:var(--accent);box-shadow:0 8px 28px rgba(16,185,129,.32);}
.pill.selected .pill-lbl{color:var(--text);}
.pill.selected .pill-ico{animation:jig .45s ease;}
@keyframes jig{0%,100%{transform:rotate(0)scale(1);}30%{transform:rotate(-14deg)scale(1.15);}70%{transform:rotate(14deg)scale(1.15);}}

/* ── SCALE ── */
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.scale .opt{flex-direction:column;text-align:center;padding:13px 6px;gap:6px;align-items:center;}
.scale .opt .opt-ico{width:34px;height:34px;font-size:17px;}
.scale .opt .opt-txt{font-size:12px;line-height:1.3;text-align:center;}
.scale .opt .opt-chk{display:none;}

/* ── CLOCK PICKER ── */
.clock-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px;}
.wheel-row{display:flex;align-items:center;gap:6px;}
.wheel-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.wheel-col-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);}
.wheel-sep{font-size:26px;font-weight:800;color:var(--accent);padding-bottom:20px;}
.wheel-shell{position:relative;width:88px;height:168px;}
.wheel-highlight{position:absolute;top:50%;left:4px;right:4px;height:48px;transform:translateY(-50%);
  background:linear-gradient(135deg,rgba(16,185,129,.28),rgba(6,182,212,.18));
  border:1px solid rgba(110,231,183,.5);border-radius:14px;pointer-events:none;z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 6px 18px rgba(16,185,129,.2);}
.wheel-scroll{position:relative;z-index:2;height:168px;overflow-y:scroll;scroll-snap-type:y mandatory;overflow-anchor:none;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  mask-image:linear-gradient(180deg,transparent 0,#000 32%,#000 68%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 32%,#000 68%,transparent 100%);}
.wheel-scroll::-webkit-scrollbar{display:none;}
.wheel-pad{height:60px;}
.wheel-item{height:48px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--muted2);scroll-snap-align:center;cursor:pointer;
  transition:color .2s,font-size .2s,text-shadow .2s;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  font-family:var(--font-display);}
.wheel-item.active{color:var(--text);font-size:24px;font-weight:800;text-shadow:0 0 20px rgba(16,185,129,.6);}
.clock-digit{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.02em;}
.clock-digit span{color:var(--accent);font-weight:800;font-size:17px;}
.clock-hint{font-size:12px;color:var(--muted2);font-weight:600;text-align:center;}
.clock-presets{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
.preset-btn{padding:7px 13px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:100px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .16s;}
.preset-btn:hover{background:rgba(16,185,129,.14);border-color:var(--accent);color:var(--text);}
.preset-btn.active{background:rgba(16,185,129,.2);border-color:var(--accent);color:var(--text);}

/* ── N-BACK ── */
.nb-arena{display:flex;flex-direction:column;align-items:center;gap:18px;padding:8px 0 4px;}
.nb-top{width:100%;display:flex;align-items:center;gap:12px;}
.nb-cnt{font-size:12px;color:var(--muted2);white-space:nowrap;font-weight:700;min-width:46px;}
.nb-track{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden;}
.nb-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.nb-tmr-badge{font-size:11px;color:var(--muted2);background:rgba(255,255,255,.08);border:1px solid var(--border);padding:4px 10px;border-radius:100px;min-width:46px;text-align:center;font-weight:700;}
.nb-box{width:190px;height:190px;background:rgba(255,255,255,.05);border:1.5px solid var(--border2);border-radius:28px;display:flex;align-items:center;justify-content:center;transition:all .16s;box-shadow:0 16px 48px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.1);}
.nb-box.ok{border-color:var(--green);box-shadow:0 0 50px rgba(52,211,153,.4),0 16px 48px rgba(0,0,0,.32);}
.nb-box.err{border-color:var(--red);box-shadow:0 0 50px rgba(248,113,113,.38),0 16px 48px rgba(0,0,0,.32);}
#nb-ltr{font-size:6.5rem;font-weight:800;letter-spacing:-.04em;color:var(--text);transition:opacity .1s,transform .1s;line-height:1;user-select:none;}
#nb-ltr.gone{opacity:0;transform:scale(.78);}
#nb-fb{font-size:13.5px;font-weight:700;height:20px;text-align:center;letter-spacing:.02em;}
#nb-fb.ok{color:var(--green);}#nb-fb.err{color:var(--red);}#nb-fb.miss{color:var(--yellow);}
.nb-btn{width:100%;max-width:340px;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.85));border:none;border-radius:16px;padding:20px;font-family:inherit;font-size:16px;font-weight:700;color:#04180e;cursor:pointer;transition:all .15s;box-shadow:0 8px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;gap:10px;}
.nb-btn:hover{transform:translateY(-1px);}
.nb-btn:active{transform:scale(.98);}
.nb-btn.pressed{background:linear-gradient(180deg,var(--green),#059669);color:#022c22;}

.metric{background:rgba(3,16,12,.32);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.1);}

.m-lbl{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-bottom:6px;}

.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;}

.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.miss{background:var(--yellow)}.dot.na{background:rgba(255,255,255,.1);}

.explain-box{background:rgba(3,16,12,.24);border:1.5px solid rgba(255,255,255,.28);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.08);}
.explain-hd{font-family:var(--font-display);font-size:13.5px;font-weight:800;letter-spacing:.02em;color:var(--text);margin-bottom:10px;text-shadow:0 1px 8px rgba(0,0,0,.35);}

const API_BASE=(()=>{
  const meta=document.querySelector('meta[name="survey-api"]')?.content?.trim();
  if(meta)return meta.replace(/\/$/,'');
  return location.protocol==='file:'?'http://localhost:8787':'';
})();
let STORE_STATUS={api:false,apiCount:0,artifact:false,localCount:0};
let ADMIN_ROWS=[];
let ADMIN_UNLOCKED=false;

function apiUrl(path){return API_BASE?API_BASE+path:path;}
function rowKey(r){return 'r:'+(r?.pid||r?.participant_id||('import_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)));}
function addRow(rows,seen,row,key){
  if(!row||typeof row!=='object')return;
  const k=key||rowKey(row);
  if(seen.has(k))return;
  rows.push(row);seen.add(k);
}
function saveLocalRow(row){
  let localOk=false;
  try{
    const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
    ex[rowKey(row)]=JSON.stringify(row);
    localStorage.setItem('tadqiqot',JSON.stringify(ex));
    localOk=true;
  }catch(e){console.warn('local save failed:',e);}
  return localOk;
}
async function saveData(d){
  let shared=false;
  try{
    const res=await fetch(apiUrl('/api/responses'),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(d)
    });
    shared=res.ok;
  }catch(e){console.warn('server save failed:',e);}
  try{
    if(!shared&&typeof window.storage!=='undefined'&&window.storage){
      await window.storage.set(rowKey(d),JSON.stringify(d),true);
      shared=true;
    }
  }catch(e){console.warn('shared storage set failed:',e);}
  return{shared,local:saveLocalRow(d)};
}
async function loadAll(){
  const rows=[];const seen=new Set();
  STORE_STATUS={api:false,apiCount:0,artifact:false,localCount:0};
  try{
    const res=await fetch(apiUrl('/api/responses'),{cache:'no-store'});
    if(res.ok){
      const data=await res.json();
      if(Array.isArray(data)){
        STORE_STATUS.api=true;STORE_STATUS.apiCount=data.length;
        data.forEach(row=>addRow(rows,seen,row,rowKey(row)));
      }
    }
  }catch(e){}
  try{
    if(typeof window.storage!=='undefined'&&window.storage){
      const l=await window.storage.list('r:',true);
      for(const k of(l?.keys||[])){
        try{
          const r=await window.storage.get(k,true);
          if(r?.value){addRow(rows,seen,JSON.parse(r.value),k);STORE_STATUS.artifact=true;}
        }catch(e){}
      }
    }
  }catch(e){}
  try{
    const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
    STORE_STATUS.localCount=Object.keys(ex).length;
    for(const k of Object.keys(ex)){
      try{addRow(rows,seen,JSON.parse(ex[k]),k);}catch(e){}
    }
  }catch(e){}
  rows.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  return rows;
}

// ═══ TIME WHEEL PICKER (hour + minute, infinite loop) ════════════════════
const CLOCKS={};
const WHEEL_ITEM=48;
const WHEEL_LOOPS=7; // repeated copies of the list so scrolling feels endless (00\u219223\u219200\u2192\u2026)
const WHEEL_MID=Math.floor(WHEEL_LOOPS/2);
function pad2(n){return String(n).padStart(2,'0');}
function buildWheelItems(list,activeRealIdx){
  const N=list.length;let html='';
  for(let block=0;block<WHEEL_LOOPS;block++){
    list.forEach((v,i)=>{
      const flat=block*N+i;
      const active=block===WHEEL_MID&&i===activeRealIdx;
      html+=`<div class="wheel-item${active?' active':''}" data-idx="${flat}">${pad2(v)}</div>`;
    });
  }
  return html;
}
function clockPicker(id,gid,defaultH,defaultM){
  const hours=[...Array(24).keys()];
  const minutes=[0,5,10,15,20,25,30,35,40,45,50,55];
  const hIdx=Math.max(0,hours.indexOf(defaultH)),mIdx=Math.max(0,minutes.indexOf(defaultM));
  CLOCKS[id]={gid,hours,minutes,curH:hours[hIdx],curM:minutes[mIdx],hTouched:false,mTouched:false,advanced:false};
  const hItems=buildWheelItems(hours,hIdx);
  const mItems=buildWheelItems(minutes,mIdx);
  return `
  <div class="clock-wrap">
    <div class="wheel-row">
      <div class="wheel-col">
        <div class="wheel-shell">
          <div class="wheel-highlight"></div>
          <div class="wheel-scroll" id="${id}_h" data-clock="${id}" data-unit="h"><div class="wheel-pad"></div>${hItems}<div class="wheel-pad"></div></div>
        </div>
        <div class="wheel-col-lbl">${LANG==='en'?'Hour':LANG==='ru'?'Час':'Soat'}</div>
      </div>
      <div class="wheel-sep">:</div>
      <div class="wheel-col">
        <div class="wheel-shell">
          <div class="wheel-highlight"></div>
          <div class="wheel-scroll" id="${id}_m" data-clock="${id}" data-unit="m"><div class="wheel-pad"></div>${mItems}<div class="wheel-pad"></div></div>
        </div>
        <div class="wheel-col-lbl">${LANG==='en'?'Minute':LANG==='ru'?'Минута':'Daqiqa'}</div>
      </div>
    </div>
    <div class="clock-digit" id="${id}_disp">${LANG==='en'?'Selected':LANG==='ru'?'Выбрано':'Tanlangan'}: <span>${pad2(defaultH)}:${pad2(minutes[mIdx])}</span></div>
    <div class="clock-hint">${LANG==='en'?'Scroll or tap to choose — keeps looping':LANG==='ru'?'Прокрутите или нажмите':'Tanlash uchun aylantiring yoki bosing'}</div>
  </div>`;
}
function markWheelActive(wrap,flatIdx){
  wrap.querySelectorAll('.wheel-item').forEach(item=>{
    item.classList.toggle('active',Number(item.dataset.idx)===flatIdx);
  });
}
function initClocks(){
  document.querySelectorAll('.wheel-scroll[data-clock]').forEach(wrap=>{
    if(wrap.dataset.bound)return;
    wrap.dataset.bound='1';
    const id=wrap.dataset.clock,unit=wrap.dataset.unit;
    // Setting scrollTop programmatically still fires a native 'scroll' event. Without this
    // flag, that self-inflicted event gets mistaken for real user scrolling, which marks the
    // wheel "touched" and can trigger auto-advance before the person has touched anything.
    let silent=true;
    // Start centred in the middle loop copy so there's room to scroll both directions.
    // Deferred to the next frame so this never races the page's own scroll-to-top.
    requestAnimationFrame(()=>{
      const cfg=CLOCKS[id];
      if(!cfg)return;
      const list=unit==='h'?cfg.hours:cfg.minutes;
      const cur=unit==='h'?cfg.curH:cfg.curM;
      const realIdx=Math.max(0,list.indexOf(cur));
      wrap.scrollTop=(WHEEL_MID*list.length+realIdx)*WHEEL_ITEM;
      markWheelActive(wrap,WHEEL_MID*list.length+realIdx);
      if(typeof pinTop==='function')pinTop();
      setTimeout(()=>{silent=false;},280);
    });
    let settleTimer=null,rafPending=false;
    wrap.addEventListener('scroll',()=>{
      if(silent)return;
      if(!rafPending){
        rafPending=true;
        requestAnimationFrame(()=>{rafPending=false;updateWheel(id,unit,false);});
      }
      clearTimeout(settleTimer);
      settleTimer=setTimeout(()=>updateWheel(id,unit,true),140);
    },{passive:true});
    wrap.querySelectorAll('.wheel-item').forEach(item=>{
      item.addEventListener('click',()=>{
        silent=false;
        const flat=Number(item.dataset.idx);
        wrap.scrollTo({top:flat*WHEEL_ITEM,behavior:'smooth'});
        clearTimeout(settleTimer);
        settleTimer=setTimeout(()=>updateWheel(id,unit,true),260);
      });
    });
  });
}
function commitClockValue(id,justSettled){
  const cfg=CLOCKS[id];if(!cfg)return;
  const lbl=`${pad2(cfg.curH)}:${pad2(cfg.curM)}`;
  const disp=document.getElementById(id+'_disp');
  if(disp) disp.innerHTML=`${LANG==='en'?'Selected':LANG==='ru'?'Выбрано':'Tanlangan'}: <span>${lbl}</span>`;
  const answerId=cfg.gid||id;
  const container=document.getElementById('g_'+answerId);
  if(container) container.dataset.val=lbl;
  // Only auto-advance to the next question once the person has actually settled on
  // BOTH the hour wheel and the minute wheel at least once, and only the first time —
  // never mid-scroll, so nobody gets yanked away while they're still spinning the wheel.
  if(justSettled&&cfg.hTouched&&cfg.mTouched&&!cfg.advanced){
    cfg.advanced=true;
    setTimeout(()=>{
      const section=container?.closest('.qs-block');
      const next=section?.nextElementSibling;
      if(next){ const top=next.getBoundingClientRect().top+window.scrollY-80; window.scrollTo({top,behavior:'smooth'}); }
    },320);
  }
}
function updateWheel(id,unit,settled){
  const wrap=document.getElementById(id+'_'+unit);
  const cfg=CLOCKS[id];
  if(!wrap||!cfg)return;
  const list=unit==='h'?cfg.hours:cfg.minutes;
  const N=list.length;
  let flat=Math.round(wrap.scrollTop/WHEEL_ITEM);
  flat=Math.max(0,Math.min(N*WHEEL_LOOPS-1,flat));
  const realIdx=((flat%N)+N)%N;
  markWheelActive(wrap,flat);
  if(unit==='h')cfg.curH=list[realIdx];else cfg.curM=list[realIdx];
  if(!settled)return; // live-scroll: just track position, don't snap/commit yet (keeps it smooth, no lag)
  if(Math.abs(wrap.scrollTop-flat*WHEEL_ITEM)>1) wrap.scrollTo({top:flat*WHEEL_ITEM,behavior:'smooth'});
  cfg[unit+'Touched']=true;
  // Recentre into the middle copy of the loop once scrolling settles, so the person
  // always has room to keep spinning past 23→00 or 55→00 in either direction.
  const bandStart=WHEEL_MID*N,bandEnd=bandStart+N-1;
  if(flat<bandStart||flat>bandEnd){
    const targetFlat=bandStart+realIdx;
    setTimeout(()=>{
      wrap.scrollTop=targetFlat*WHEEL_ITEM;
      markWheelActive(wrap,targetFlat);
    },260);
  }
  commitClockValue(id,true);
}
function selectClock(id,hour,minute,gid,autoScroll=true){
  const cfg=CLOCKS[id];if(!cfg)return;
  if(gid) cfg.gid=gid;
  const hIdx=cfg.hours.indexOf(hour),mIdx=cfg.minutes.indexOf(minute);
  if(hIdx>=0)cfg.curH=cfg.hours[hIdx];
  if(mIdx>=0)cfg.curM=cfg.minutes[mIdx];
  // Wheels position themselves centred on first render inside initClocks(); this just
  // primes the starting value silently (no page-scroll) before that happens.
  commitClockValue(id,false);
}

function calcPSQI(){
  const p=S.psqi;
  const c1=p.p6||0;
  const lat=p.q2||0;
  const c2s=lat+(p['5a']||0);const c2=c2s===0?0:c2s<=2?1:c2s<=4?2:3;
  const c3=p.q4||0;
  // C4: sleep efficiency using parsed times
  let c4=0;
  try{
    if(p.q1&&p.q3){
      const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+(m||0);};
      let bed=toMin(p.q1),wake=toMin(p.q3);
      if(wake<=bed)wake+=1440;
      const tib=(wake-bed)/60;
      const actualMap=[4.5,5.5,6.5,7.5];
      const actual=actualMap[p.q4]||7;
      const se=(actual/tib)*100;
      c4=se>=85?0:se>=75?1:se>=65?2:3;
    }
  }catch(e){}
  const c5s=PSQI5.reduce((s,k)=>s+(p['5'+k]||0),0);const c5=c5s===0?0:c5s<=9?1:c5s<=18?2:3;
  const c6=p.p7||0;
  const c7s=(p.p8||0)+(p.p9||0);const c7=c7s===0?0:c7s<=2?1:c7s<=4?2:3;
  return c1+c2+c3+c4+c5+c6+c7;
}

// ═══ N-BACK TASK (guided practice round, then the real scored test) ══════
const LTRS=['B','D','F','G','H','K','L','M','N','P','R','S','T'];
const NB_TOTAL=22,NB_SHOW=2000,NB_BLANK=280;
const NB_PRACTICE_TOTAL=8,NB_PRACTICE_SHOW=2800,NB_PRACTICE_BLANK=350;
let nbSeq=[],nbIdx=0,nbResponded=false,nbStart=0,nbTimer=null,nbRAF=null;
let nbMode='practice',nbPracticeCorrect=0;

function genSeq(n){
  const s=[];
  for(let i=0;i<n;i++){
    if(i>=2&&Math.random()<0.34){s.push(s[i-2]);}
    else{let l;do{l=LTRS[Math.floor(Math.random()*LTRS.length)];}while(i>=2&&l===s[i-2]);s.push(l);}
  }return s;
}
function genPracticeSeq(n){
  // Teaching-oriented sequence: guarantees an early, obvious match so the rule "clicks" fast.
  const s=[];
  const forceMatchAt=new Set([2,5]);
  for(let i=0;i<n;i++){
    if(i>=2&&forceMatchAt.has(i)){s.push(s[i-2]);}
    else if(i>=2&&Math.random()<0.28){s.push(s[i-2]);}
    else{let l;do{l=LTRS[Math.floor(Math.random()*LTRS.length)];}while(i>=2&&l===s[i-2]);s.push(l);}
  }return s;
}
function startNback(){
  nbMode='practice';nbPracticeCorrect=0;
  nbSeq=genPracticeSeq(NB_PRACTICE_TOTAL);nbIdx=0;
  S.step=7;s7();
  setTimeout(runTrial,700);
}
function startRealNback(){
  nbMode='real';
  nbSeq=genSeq(NB_TOTAL);nbIdx=0;S.nback.trials=[];
  s7();
  setTimeout(runTrial,700);
}
function retryPractice(){
  nbMode='practice';nbPracticeCorrect=0;
  nbSeq=genPracticeSeq(NB_PRACTICE_TOTAL);nbIdx=0;
  s7();
  setTimeout(runTrial,700);
}
function s7(){
  setP(7);
  const total=nbMode==='practice'?NB_PRACTICE_TOTAL:NB_TOTAL;
  const showMs=nbMode==='practice'?NB_PRACTICE_SHOW:NB_SHOW;
  const badge=nbMode==='practice'
    ?`<div class="nb-mode-badge practice">🎓 ${LANG==='en'?'Practice — not scored':LANG==='ru'?'Практика — не оценивается':"Mashq — baholanmaydi"}</div>`
    :`<div class="nb-mode-badge real">✅ ${LANG==='en'?'Real test':LANG==='ru'?'Настоящий тест':'Asosiy test'}</div>`;
  app.innerHTML=`<div class="screen active" id="sc7">
  <div class="card"><div class="card-inner">
    <div class="eyebrow">7 / 9 · ${t('nb_t')}</div>
    ${badge}
    <div class="nb-arena">
      <div class="nb-top">
        <span class="nb-cnt" id="nb-cnt">1/${total}</span>
        <div class="nb-track"><div class="nb-fill" id="nb-fill" style="width:0%"></div></div>
        <div class="nb-tmr-badge" id="nb-tmr">${(showMs/1000).toFixed(1)}s</div>
      </div>
      <div class="nb-box" id="nb-box"><div id="nb-ltr">·</div></div>
      <div id="nb-fb"></div>
      <button class="nb-btn" id="nb-btn" onclick="nbPress()">
        ${t('nb_match')} <span class="key-tag">SPACE</span>
      </button>
      <div id="nb-explain"></div>
    </div>
  </div></div>
  </div>`;
}
function runTrial(){
  const total=nbMode==='practice'?NB_PRACTICE_TOTAL:NB_TOTAL;
  const show=nbMode==='practice'?NB_PRACTICE_SHOW:NB_SHOW;
  const blank=nbMode==='practice'?NB_PRACTICE_BLANK:NB_BLANK;
  if(nbIdx>=nbSeq.length){
    if(nbMode==='practice'){showPracticeSummary();}else{finishNback();}
    return;
  }
  nbResponded=false;
  const ltr=nbSeq[nbIdx];const isM=nbIdx>=2&&ltr===nbSeq[nbIdx-2];
  const lEl=document.getElementById('nb-ltr'),box=document.getElementById('nb-box');
  const fb=document.getElementById('nb-fb'),btn=document.getElementById('nb-btn'),ex=document.getElementById('nb-explain');
  if(!lEl)return;
  box.className='nb-box';fb.textContent='';fb.className='';btn&&btn.classList.remove('pressed');
  if(ex)ex.innerHTML='';
  lEl.classList.add('gone');
  setTimeout(()=>{if(document.getElementById('nb-ltr')){lEl.textContent=ltr;lEl.classList.remove('gone');}},blank);
  document.getElementById('nb-cnt').textContent=(nbIdx+1)+'/'+total;
  document.getElementById('nb-fill').style.width=((nbIdx/total)*100)+'%';
  nbStart=performance.now();startTimerAnim(show);clearTimeout(nbTimer);
  nbTimer=setTimeout(()=>{
    stopTimerAnim();
    if(!nbResponded){
      if(nbMode==='real'){
        S.nback.trials.push({ltr,isM,responded:false,correct:!isM,rt:null});
        if(isM){const f=document.getElementById('nb-fb');if(f){f.textContent=t('nb_miss');f.className='miss';}}
      }else{
        if(!isM)nbPracticeCorrect++; // correctly withheld on a non-match
        showPracticeExplain(isM,false,ltr);
      }
    }
    const le=document.getElementById('nb-ltr');if(le)le.classList.add('gone');
    if(nbMode==='real'){nbIdx++;setTimeout(runTrial,blank);}
    // Practice mode never auto-advances — it waits for the person to tap "Continue"
    // after reading the explanation, so nobody gets rushed while still learning the rule.
  },show);

// ═══ SIGNAL DETECTION (d-prime, criterion c) ════════════════════════════
function erfc(x){
  // Numerical Recipes erfc approximation, |error| < 1.2e-7
  const z=Math.abs(x);
  const t=1/(1+z/2);
  const ans=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+
    t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));
  return x>=0?ans:2-ans;
}
function probit(p){
  // Peter Acklam's high-precision inverse normal CDF (~1.15e-9 relative error),
  // refined with one step of Halley's rational method for extra accuracy.
  if(p<=0)return-8.2;if(p>=1)return 8.2;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const plow=0.02425,phigh=1-plow;
  let q,r,x;
  if(p<plow){
    q=Math.sqrt(-2*Math.log(p));
    x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }else if(p<=phigh){
    q=p-0.5;r=q*q;
    x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }else{
    q=Math.sqrt(-2*Math.log(1-p));
    x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  const e=0.5*erfc(-x/Math.SQRT2)-p;
  const u=e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2);
  x=x-u/(1+x*u/2);
  return x;
}
function nbStats(trials){
  const tgt=trials.filter(x=>x.isM);
  const ntgt=trials.filter(x=>!x.isM);
  const nT=tgt.length,nNT=ntgt.length;
  if(!nT||!nNT)return{dprime:null,bias:null,acc:0,hits:0,misses:0,fa:0,cr:0,meanRT:null,medRT:null};
  const hits=tgt.filter(x=>x.responded).length;
  const misses=nT-hits;
  const fa=ntgt.filter(x=>x.responded).length;
  const cr=nNT-fa;
  // Edge correction (Hautus, 1995)
  const HR=hits===0?.5/nT:hits===nT?1-.5/nT:hits/nT;
  const FAR=fa===0?.5/nNT:fa===nNT?1-.5/nNT:fa/nNT;
  const zH=probit(HR),zF=probit(FAR);
  const dprime=Math.round((zH-zF)*1000)/1000;
  const bias=Math.round((-0.5*(zH+zF))*1000)/1000; // criterion c (positive=conservative)
  // Overall accuracy (correct responses / total)
  const acc=Math.round(((hits+cr)/trials.length)*100);
  // Hit rate accuracy (hits / targets, for display)
  const hitAcc=Math.round((hits/nT)*100);
  // RT: hits only (correct responses to targets), ms
  const rts=tgt.filter(x=>x.responded&&x.rt).map(x=>x.rt);
  let meanRT=null,medRT=null;
  if(rts.length){
    meanRT=Math.round(rts.reduce((a,b)=>a+b,0)/rts.length);
    const sorted=[...rts].sort((a,b)=>a-b);
    medRT=rts.length%2===0?(sorted[rts.length/2-1]+sorted[rts.length/2])/2:sorted[Math.floor(rts.length/2)];
    medRT=Math.round(medRT);
  }
  return{dprime,bias,acc,hitAcc,hits,misses,fa,cr,meanRT,medRT,nT,nNT};
}

async function assignParticipantId(){
  // Ask the shared collector for the next clean sequential id ("participant1", "participant2"...).
  try{
    const res=await fetch(apiUrl('/api/next-id'),{cache:'no-store'});
    if(res.ok){
      const j=await res.json();
      if(j&&j.id)return j.id;
    }
  }catch(e){}
  // Offline fallback: derive a sequential-looking id from this device's local backup count.
  try{
    const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
    return 'participant'+(Object.keys(ex).length+1);
  }catch(e){}
  return 'participant'+Date.now();
}

      vx:(Math.random()-.5)*3,vy:Math.random()*5+2,
      r:Math.random()*7+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,rSpeed:(Math.random()-.5)*8,
      shape:Math.random()<.5?'rect':'circle',
      alpha:1,gravity:.12
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    for(const p of particles){
      p.vy+=p.gravity;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rSpeed;p.alpha-=0.006;
      if(p.alpha>0&&p.y<canvas.height+20){
        alive=true;
        ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);
        ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle=p.color;
        if(p.shape==='rect'){ctx.fillRect(-p.r/2,-p.r/1.5,p.r,p.r*1.3);}
        else{ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}
        ctx.restore();
      }
    }
    if(alive&&frame<360){frame++;requestAnimationFrame(draw);}
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

function renderAdminTable(){
  const wrap=document.getElementById('admin-tbl-wrap');
  if(!wrap)return;
  const flat=ADMIN_ROWS.map(r=>({...flattenRow(r),__pid:r.pid||r.participant_id||'',__date:r.date||''}));
  const keys=ADMIN_SUMMARY_KEYS;
  const q=ADMIN_FILTER;
  const filtered=q?flat.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q))):flat;
  const head=`<th>${LANG==='en'?'Delete':'O\u2018chirish'}</th>`+keys.map(k=>`<th>${esc(ADMIN_LABELS[k]||k)}</th>`).join('');
  const body=filtered.map(r=>{
    const cells=keys.map(k=>{
      let v=r[k];
      if(k==='mig_likely')v=v?'Yes':'No';
      if(k==='date'&&v)v=new Date(v).toLocaleString();
      return `<td>${esc(v)}</td>`;
    }).join('');
    const delTitle=LANG==='en'?'Delete participant':'Ishtirokchini o\u2018chirish';
    return `<tr><td><button type="button" class="row-del" data-pid="${esc(r.__pid)}" data-date="${esc(r.__date)}" title="${delTitle}">🗑</button></td>${cells}</tr>`;
  }).join('');
  wrap.innerHTML=`<table>
    <thead><tr>${head}</tr></thead>

  </table>`;
  wrap.querySelectorAll('.row-del').forEach(btn=>{
    btn.addEventListener('click',()=>deleteParticipant(btn.dataset.pid,btn.dataset.date));
  });
}
async function deleteParticipant(pid,dateFallback){
  // Some legacy/imported rows may be missing a clean pid \u2014 fall back to matching by
  // the exact save timestamp so every row on screen is still deletable.
  const identity=pid||dateFallback;
  if(!identity){toast('⚠️ '+(LANG==='en'?'Could not identify this row':'Bu qatorni aniqlab bo\u2018lmadi'),'var(--red)');return;}
  const label=pid||(LANG==='en'?'this row':'bu qator');
  if(!confirm((LANG==='en'?'Delete participant':'Ishtirokchini o\u2018chirish')+' "'+label+'"? '+(LANG==='en'?'This cannot be undone.':'Buni bekor qilib bo\u2018lmaydi.')))return;
  let serverConfirmed=false,serverReachable=false;
  try{
    const res=await fetch(apiUrl('/api/responses/'+encodeURIComponent(identity)),{method:'DELETE'});
    serverReachable=true;
    if(res.ok){
      const j=await res.json().catch(()=>null);
      serverConfirmed=!!(j&&j.removed>0);
    }
  }catch(e){console.warn('server delete failed:',e);}
  try{
    const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
    for(const k of Object.keys(ex)){
      try{
        const r=JSON.parse(ex[k]);
        const rid=String(r.pid||r.participant_id||''),rdate=String(r.date||'');
        if(rid===String(identity)||rdate===String(identity))delete ex[k];
      }catch(e){}
    }
    localStorage.setItem('tadqiqot',JSON.stringify(ex));
  }catch(e){}
  try{
    if(typeof window.storage!=='undefined'&&window.storage){
      const l=await window.storage.list('r:',true);
      for(const k of(l?.keys||[])){
        try{
          const r=await window.storage.get(k,true);
          if(r?.value){
            const parsed=JSON.parse(r.value);
            const rid=String(parsed.pid||parsed.participant_id||''),rdate=String(parsed.date||'');
            if(rid===String(identity)||rdate===String(identity))await window.storage.delete(k,true);
          }
        }catch(e){}
      }
    }
  }catch(e){}
  if(STORE_STATUS.api&&serverReachable&&!serverConfirmed){
    toast('⚠️ '+(LANG==='en'?'Server did not confirm deletion \u2014 check the collector is running and try again':'Server o\u2018chirishni tasdiqlamadi \u2014 qayta urinib ko\u2018ring'),'var(--yellow)');
  }else if(STORE_STATUS.api&&!serverReachable){
    toast('⚠️ '+(LANG==='en'?'Could not reach the collector server \u2014 removed locally only':'Serverga ulanib bo\u2018lmadi'),'var(--yellow)');
  }else{
    toast('🗑 '+(LANG==='en'?'Deleted':'O\u2018chirildi')+' '+label,'var(--green)');
  }
  await renderAdmin();
}
function importedRowsFromJSON(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.responses))return data.responses;
  if(data&&typeof data==='object'){
    return Object.values(data).map(v=>{
      if(typeof v==='string'){try{return JSON.parse(v);}catch(e){return null;}}
      return v;
    }).filter(v=>v&&typeof v==='object');
  }
  return[];
}
async function importJSON(file){
  if(!file)return;
  try{
    const rows=importedRowsFromJSON(JSON.parse(await file.text()));
    let count=0;
    for(const row of rows){
      if(!row||typeof row!=='object')continue;
      if(!row.pid&&row.participant_id)row.pid=row.participant_id;
      await saveData(row);count++;
    }
    toast(`Imported ${count} rows`,count?'var(--green)':'var(--yellow)');
    await renderAdmin();
  }catch(e){toast('Import failed: '+e.message,'var(--red)');}
}

function flattenRow(r){
  return{
    participant_id:r.pid,date:r.date,language:r.lang,duration_sec:r.dur,
    age:r.demo?.age,sex:r.demo?.sex,grade:r.demo?.grade,headache_today:r.demo?.ha,
    mig_q1:r.migraine?.q0,mig_q2:r.migraine?.q1,mig_q3:r.migraine?.q2,
    mig_score:r.migraine?.score,mig_likely:r.migraine?.likely,mig_freq:r.migraine?.freq,
    psqi_q1_bedtime:r.psqi?.q1,psqi_q2_latency:r.psqi?.q2,psqi_q3_waketime:r.psqi?.q3,psqi_q4_duration:r.psqi?.q4,
    psqi_5a:r.psqi?.['5a'],psqi_5b:r.psqi?.['5b'],psqi_5c:r.psqi?.['5c'],psqi_5d:r.psqi?.['5d'],
    psqi_5e:r.psqi?.['5e'],psqi_5f:r.psqi?.['5f'],psqi_5g:r.psqi?.['5g'],psqi_5h:r.psqi?.['5h'],psqi_5i:r.psqi?.['5i'],
    psqi_p6:r.psqi?.p6,psqi_p7:r.psqi?.p7,psqi_p8:r.psqi?.p8,psqi_p9:r.psqi?.p9,
    psqi_global:r.psqi?.global,
    nback_accuracy_pct:r.nback?.acc,
    nback_hit_accuracy:r.nback?.hitAcc,
    nback_dprime:r.nback?.dprime,
    nback_criterion_c:r.nback?.bias,
    nback_mean_rt_ms:r.nback?.meanRT,
    nback_median_rt_ms:r.nback?.medRT,
    nback_hits:r.nback?.hits,
    nback_misses:r.nback?.misses,
    nback_false_alarms:r.nback?.fa,
    nback_correct_rejections:r.nback?.cr
  };
}
function dlXLSX(rows){
  if(!rows.length){toast('No data','var(--red)');return;}
  try{
    const flat=rows.map(flattenRow);
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(flat);
    // column widths
    ws['!cols']=Object.keys(flat[0]).map(k=>({wch:Math.max(k.length,12)}));
    XLSX.utils.book_append_sheet(wb,ws,'Survey Data');
    // Info sheet
    const info=[
      {Variable:'participant_id',Description:'Unique participant identifier'},
      {Variable:'mig_dprime',Description:'d-prime: signal detection sensitivity (hits vs false alarms)'},
      {Variable:'nback_criterion_c',Description:'Response criterion c: positive=conservative, negative=liberal'},
      {Variable:'psqi_global',Description:'PSQI global score: >5 = poor sleep quality'},
      {Variable:'mig_likely',Description:'TRUE if ID-Migraine score >= 2 (migraine likely)'},
    ];
    const wsInfo=XLSX.utils.json_to_sheet(info);
    XLSX.utils.book_append_sheet(wb,wsInfo,'Codebook');
    XLSX.writeFile(wb,'survey_data.xlsx');
  }catch(e){toast('XLSX error: '+e.message,'var(--red)');}
}
function dlCSV(rows){
  if(!rows.length){toast('No data','var(--red)');return;}
  const flat=rows.map(flattenRow);
  const h=Object.keys(flat[0]);
  const csv=[h.join(','),...flat.map(r=>h.map(k=>`"${(r[k]??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  dl(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),'survey_data.csv');
}
function dlJSON(rows){dl(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}),'survey_data.json');}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);}

// ═══ RENDER ════════════════════════════════════════════════════════════════
function pinTop(){
  // Force the window back to the top. Called more than once on purpose \u2014
  // this is a defensive net against any late layout shift (wheel positioning,
  // web-font swap, mobile reflow) that might otherwise nudge the scroll position
  // after the initial jump-to-top already happened.
  window.scrollTo(0,0);
}
function render(){
  movePill(LANG);
  const steps=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9];
  if(S.step===7){s7();setTimeout(()=>{if(nbSeq.length>0&&nbIdx===0)runTrial();},160);}
  else if(steps[S.step])steps[S.step]();
  pinTop();
  requestAnimationFrame(()=>{pinTop();requestAnimationFrame(pinTop);});
  setTimeout(pinTop,60);
  setTimeout(pinTop,180);
  setTimeout(pinTop,400);
}
render();
