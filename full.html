<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Migraine, Sleep & Memory — Scientific Study</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#121214;
  --card:#1b1b1f;--card-hi:#232327;
  --ink:#f4f2ea;
  --border:rgba(244,242,234,0.14);--border2:rgba(244,242,234,0.85);
  --text:#f4f2ea;--sub:rgba(244,242,234,0.9);--muted:rgba(244,242,234,0.68);--muted2:rgba(244,242,234,0.46);
  --accent:#2b3f9e;--accent2:#ffd23f;--accent3:#00d9c0;
  --green:#4ade80;--red:#f4425e;--yellow:#ffd23f;--blue:#38bdf8;--violet:#a78bfa;--rose:#ff5470;
  --r:10px;--rs:8px;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --edge-shadow:0 1px 2px rgba(0,0,0,.5),0 1px 10px rgba(0,0,0,.3);
  --hard:4px 4px 0 rgba(0,0,0,.55);
  --bg-pattern:rgba(244,242,234,.025);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f6f4ee;
  --card:#ffffff;--card-hi:#efece3;
  --ink:#18181c;
  --border:rgba(24,24,28,0.12);--border2:rgba(24,24,28,0.8);
  --text:#18181c;--sub:rgba(24,24,28,0.86);--muted:rgba(24,24,28,0.62);--muted2:rgba(24,24,28,0.42);
  --edge-shadow:none;
  --hard:4px 4px 0 rgba(24,24,28,.18);
  --bg-pattern:rgba(24,24,28,.05);
  color-scheme:light;
}
html,body{transition:background-color .3s,color .3s;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;overflow-anchor:none;}
html{scroll-behavior:smooth;overflow-anchor:none;}
body{font-family:var(--font-body);color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-shadow:var(--edge-shadow);overflow-anchor:none;display:flex;flex-direction:column;align-items:center;justify-content:center;}

/* ── BG: flat, graphic, no blur/glow ── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  repeating-linear-gradient(135deg,var(--bg-pattern) 0 2px,transparent 2px 34px);}
.orb{position:absolute;will-change:transform;}
.o1{width:230px;height:230px;border-radius:50%;border:2.5px solid rgba(43,63,158,.4);top:-70px;left:-70px;opacity:.55;animation:fl1 26s ease-in-out infinite;}
.o2{width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-bottom:220px solid transparent;border-bottom-color:rgba(255,210,63,.16);bottom:2%;right:-40px;opacity:.6;animation:fl3 22s ease-in-out infinite;}
.o3{width:150px;height:150px;border:2.5px solid rgba(0,217,192,.32);top:44%;left:-50px;opacity:.5;animation:fl2 20s ease-in-out infinite;transform:rotate(20deg);}
.o4{width:90px;height:90px;border-radius:50%;border:2.5px solid rgba(43,63,158,.32);top:12%;right:6%;opacity:.55;animation:fl2 17s ease-in-out infinite reverse;}
.o5{width:60px;height:60px;background:rgba(0,217,192,.14);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);top:66%;right:14%;opacity:.7;animation:fl3 19s ease-in-out infinite reverse;}
.o6{width:26px;height:26px;border-radius:50%;background:rgba(255,210,63,.5);top:26%;left:16%;opacity:.8;animation:fl4 11s ease-in-out infinite;}
.o7{width:110px;height:110px;border:2.5px solid rgba(255,210,63,.3);top:-40px;right:22%;opacity:.5;animation:fl5 24s linear infinite;}
.o8{width:70px;height:70px;background:rgba(43,63,158,.16);clip-path:polygon(20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%,0 20%);bottom:8%;left:8%;opacity:.65;animation:fl1 21s ease-in-out infinite reverse;}
@keyframes fl1{0%,100%{transform:translate(0,0) rotate(0);}50%{transform:translate(50px,36px) rotate(18deg);}}
@keyframes fl2{0%,100%{transform:translate(0,0) rotate(20deg);}50%{transform:translate(-38px,48px) rotate(50deg);}}
@keyframes fl3{0%,100%{transform:translate(0,0) rotate(0);}50%{transform:translate(24px,-32px) rotate(-16deg);}}
@keyframes fl4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(18px,-22px) scale(1.35);}}
@keyframes fl5{0%{transform:translate(0,0) rotate(0);}100%{transform:translate(0,0) rotate(360deg);}}
@media (prefers-reduced-motion: reduce){
  .orb{animation:none!important;}
  .pbar{animation:none!important;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}

/* SVG distortion filter (hidden, unused) */
.svg-defs{position:absolute;width:0;height:0;pointer-events:none;}

/* ── LAYOUT ── */
#app{position:relative;z-index:10;width:100%;max-width:640px;margin:0 auto;padding:58px 14px 90px;overflow-anchor:none;}

/* ── RESPONSIVE WIDTH: laptop/desktop gets a roomier survey box; phones are untouched ──
   Keyed off viewport width rather than user-agent sniffing on purpose — that's what stays
   correct if someone resizes a browser window, uses a tablet in landscape as a laptop
   replacement, or has a spoofed/unusual UA string, and it's what actually determines how
   much screen space is available to lay the box out in. Everything below 860px (i.e. every
   real phone, and narrow tablets/windows) renders exactly as before — nothing here changes
   that tier at all. */
@media(min-width:860px){
  #app{max-width:760px;}
  .card{padding:34px 42px;}
}
@media(min-width:1180px){
  #app{max-width:880px;}
  .card{padding:38px 52px;}
}

/* ── PROGRESS ── */
.pbar-shell{position:fixed;top:0;left:0;right:0;z-index:300;height:4px;background:var(--card);}
.pbar{height:100%;background:var(--accent);transition:width .5s ease;}
@keyframes shim{to{background-position:300%;}}
.pbar-meta{position:fixed;top:10px;left:0;right:0;z-index:300;display:flex;justify-content:space-between;align-items:center;padding:0 54px 0 14px;pointer-events:none;}
.pbar-pill{background:var(--card);border:2px solid var(--border2);border-radius:var(--rs);padding:5px 12px;font-size:11px;font-weight:700;color:var(--text);letter-spacing:.04em;font-family:var(--font-display);box-shadow:3px 3px 0 rgba(0,0,0,.5);}
.pbar-pct{color:var(--accent);font-size:11px;font-weight:700;}

/* ── LANG SWITCHER ── */
.lang-switch{
  position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:400;
  background:var(--card);
  border:2px solid var(--border2);border-radius:var(--rs);
  padding:3px;display:flex;align-items:center;
  pointer-events:all;transition:opacity .4s,transform .4s;
  box-shadow:3px 3px 0 rgba(0,0,0,.5);
}
.lang-switch.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-10px);}
.lang-opt{position:relative;z-index:2;padding:5px 13px;border-radius:6px;font-size:11.5px;font-weight:700;color:var(--muted2);cursor:pointer;transition:color .2s;white-space:nowrap;display:flex;align-items:center;gap:5px;user-select:none;}
.lang-opt.active{color:#1a0a10;}
.lang-pill{position:absolute;top:3px;bottom:3px;background:var(--accent);border-radius:6px;transition:left .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1);z-index:1;}
.theme-toggle{position:fixed;top:8px;right:12px;z-index:400;width:34px;height:34px;border-radius:var(--rs);background:var(--card);border:2px solid var(--border2);box-shadow:3px 3px 0 rgba(0,0,0,.5);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.theme-toggle:hover{transform:translate(-1px,-1px);}
.theme-toggle:active{transform:translate(2px,2px);}

/* ── FLAT BORDERED CARD (no glass, no gradient, hard shadow) ── */
.card{
  position:relative;
  background:var(--card);
  border:2.5px solid var(--border2);
  border-radius:var(--r);
  box-shadow:6px 6px 0 rgba(43,63,158,.9);
  padding:28px 24px;
  margin-bottom:22px;
  overflow:hidden;
  isolation:isolate;
}
.card::before{content:'';position:absolute;top:14px;right:-34px;width:110px;height:26px;background:var(--accent2);transform:rotate(45deg);z-index:1;}
.card::after{content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;}
.card-inner{position:relative;z-index:2;}
.rule-panel{background:var(--card-hi);border:2px solid var(--border);border-radius:var(--rs);padding:18px;margin-bottom:14px;}

/* ── TYPOGRAPHY ── */
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#1a0a10;background:var(--accent2);border:2px solid var(--border2);padding:6px 13px;border-radius:var(--rs);margin-bottom:14px;box-shadow:3px 3px 0 rgba(0,0,0,.5);font-family:var(--font-display);}
.eyebrow::before{content:'';width:6px;height:6px;background:#1a0a10;}
h1,h2,h3{font-family:var(--font-display);}
h1{font-size:clamp(1.9rem,7vw,3rem);font-weight:700;letter-spacing:-.035em;line-height:1.05;}
h1 .grad{color:var(--accent);text-shadow:3px 3px 0 var(--accent2);}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1.25;color:var(--text);}
h3{font-size:1.05rem;font-weight:700;color:var(--text);}
p{color:var(--sub);line-height:1.7;font-size:.98rem;}
.muted2{color:var(--muted2);font-size:.83rem;}
.qs{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;margin-top:22px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
.qs:first-of-type,.qs.first{margin-top:0;}
.qs-icon{font-size:18px;flex-shrink:0;margin-top:1px;}

/* ── BUTTONS: flat fill, thick border, hard press shadow ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 28px;border-radius:var(--rs);border:2.5px solid var(--border2);font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-.01em;cursor:pointer;transition:transform .1s,box-shadow .1s;position:relative;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:4px 4px 0 rgba(0,0,0,.55);}
.btn-primary:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,.55);}
.btn-primary:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,.55);}
.btn-ghost{background:var(--card-hi);border:2.5px solid var(--border2);color:var(--text);box-shadow:4px 4px 0 rgba(0,0,0,.4);}
.btn-ghost:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,.4);}
.btn-ghost:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,.4);}
.btn-full{width:100%;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;}
.brow{display:flex;gap:10px;margin-top:22px;justify-content:space-between;flex-wrap:wrap;}

/* ── SCREENS ── */
.screen{display:none;}
.screen.active{display:block;animation:sIn .45s cubic-bezier(.34,1.15,.64,1);}
@keyframes sIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* ── HERO ── */
.hero{text-align:center;padding:50px 0 26px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 19px;border-radius:10px;background:var(--card-hi);border:1.5px solid rgba(43,63,158,.45);font-size:12px;font-weight:700;color:#fdba74;letter-spacing:.03em;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:var(--font-display);}
.hero-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,63,158,.6);}70%{box-shadow:0 0 0 10px rgba(43,63,158,0);}100%{box-shadow:0 0 0 0 rgba(43,63,158,0);}}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.info-item{display:flex;align-items:center;gap:10px;background:var(--card-hi);border:1px solid var(--border);border-radius:14px;padding:13px 14px;}
.info-icon{width:38px;height:38px;border-radius:10px;background:rgba(43,63,158,.14);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.info-lbl{font-size:10px;color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.info-val{font-size:13.5px;font-weight:600;color:var(--text);margin-top:2px;}
.contact-bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.proj-footer{margin-top:20px;padding:14px 16px;text-align:center;font-size:11.5px;line-height:1.9;color:var(--muted2);border-top:2px dashed var(--border);}
.proj-footer strong{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-family:var(--font-display);}
.proj-edit{color:var(--accent2);font-weight:700;}
.contact-chip{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:11px;background:var(--card-hi);border:1px solid var(--border2);border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:500;color:var(--muted);overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.1);}
.c-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.c-ico svg{width:17px;height:17px;}
.c-ico.mail{background:rgba(43,63,158,.16);border:1px solid rgba(43,63,158,.4);color:#fdba74;}
.c-ico.tg{background:rgba(96,165,250,.18);border:1px solid rgba(96,165,250,.45);color:#60a5fa;}
.contact-chip>div{min-width:0;}
.contact-chip a{color:var(--accent);text-decoration:none;font-weight:600;overflow-wrap:anywhere;word-break:break-word;}

/* ── NUMBER GRID ── */
.num-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;}
.num-chip{min-width:58px;height:56px;border-radius:14px;background:var(--card-hi);border:1px solid var(--border2);box-shadow:0 3px 10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--text);cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);gap:2px;padding:0 10px;}
.num-chip small{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--muted2);}
.num-chip:hover{background:var(--card-hi);border-color:var(--border2);transform:translateY(-2px);}
.num-chip.selected{background:linear-gradient(135deg,rgba(43,63,158,.34),rgba(255,210,63,.22));border-color:var(--accent);box-shadow:0 6px 20px rgba(43,63,158,.32);transform:translateY(-2px);}
.num-chip.selected small{color:var(--accent);}

/* ── OPTIONS ── */
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:center;gap:13px;background:var(--card-hi);border:1px solid var(--border2);border-bottom-width:2px;border-radius:15px;padding:14px 16px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);box-shadow:0 3px 10px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.1);}
.opt:hover{background:var(--card-hi);border-color:var(--border2);transform:translateY(-1px);}
.opt.selected{background:linear-gradient(135deg,rgba(43,63,158,.26),rgba(255,210,63,.16));border-color:rgba(43,63,158,.6);box-shadow:0 6px 22px rgba(43,63,158,.28);}
.opt-ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;transition:transform .22s;}
.opt:hover .opt-ico{transform:scale(1.1) rotate(-6deg);}
.opt.selected .opt-ico{background:rgba(43,63,158,.24);}
.opt-txt{flex:1;font-size:15px;font-weight:500;color:var(--sub);}
.opt.selected .opt-txt{color:var(--text);font-weight:600;}
.opt-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .18s;flex-shrink:0;}
.opt.selected .opt-chk{background:var(--accent);border-color:var(--accent);color:#1c1204;}

/* ── PILLS ── */
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
.pill{background:var(--card-hi);border:1px solid var(--border2);border-bottom-width:3px;border-radius:17px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1);box-shadow:0 3px 10px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.1);}
.pill:hover{background:var(--card-hi);border-color:var(--border2);transform:translateY(-3px);}
.pill-ico{font-size:34px;display:block;margin-bottom:9px;transition:transform .28s;}
.pill:hover .pill-ico{transform:scale(1.18) rotate(-5deg);}
.pill-lbl{font-size:15px;font-weight:600;color:var(--sub);}
.pill.selected{background:linear-gradient(180deg,rgba(43,63,158,.3),rgba(255,210,63,.18));border-color:var(--accent);box-shadow:0 8px 28px rgba(43,63,158,.32);}
.pill.selected .pill-lbl{color:var(--text);}
.pill.selected .pill-ico{animation:jig .45s ease;}
@keyframes jig{0%,100%{transform:rotate(0)scale(1);}30%{transform:rotate(-14deg)scale(1.15);}70%{transform:rotate(14deg)scale(1.15);}}

/* ── SCALE ── */
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.scale .opt{flex-direction:column;text-align:center;padding:13px 6px;gap:6px;align-items:center;}
.scale .opt .opt-ico{width:34px;height:34px;font-size:17px;}
.scale .opt .opt-txt{font-size:12px;line-height:1.3;text-align:center;}
.scale .opt .opt-chk{display:none;}

/* ── CLOCK PICKER ── */
.clock-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px;}
.wheel-row{display:flex;align-items:center;gap:6px;}
.wheel-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.wheel-col-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);}
.wheel-sep{font-size:26px;font-weight:800;color:var(--accent);padding-bottom:20px;}
.wheel-shell{position:relative;width:88px;height:168px;}
.wheel-highlight{position:absolute;top:50%;left:4px;right:4px;height:48px;transform:translateY(-50%);
  background:linear-gradient(135deg,rgba(43,63,158,.28),rgba(255,210,63,.18));
  border:1px solid rgba(0,217,192,.5);border-radius:14px;pointer-events:none;z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px rgba(43,63,158,.2);}
.wheel-scroll{position:relative;z-index:2;height:168px;overflow-y:scroll;scroll-snap-type:y mandatory;overflow-anchor:none;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  mask-image:linear-gradient(180deg,transparent 0,#000 32%,#000 68%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 32%,#000 68%,transparent 100%);}
.wheel-scroll::-webkit-scrollbar{display:none;}
.wheel-pad{height:60px;}
.wheel-item{height:48px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--muted2);scroll-snap-align:center;cursor:pointer;
  transition:color .2s,font-size .2s,text-shadow .2s;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  font-family:var(--font-display);}
.wheel-item.active{color:var(--text);font-size:24px;font-weight:800;text-shadow:0 0 20px rgba(43,63,158,.6);}
.clock-digit{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.02em;}
.clock-digit span{color:var(--accent);font-weight:800;font-size:17px;}
.clock-hint{font-size:12px;color:var(--muted2);font-weight:600;text-align:center;}
.clock-presets{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
.preset-btn{padding:7px 13px;background:var(--card-hi);border:1px solid var(--border);border-radius:12px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .16s;}
.preset-btn:hover{background:rgba(43,63,158,.14);border-color:var(--accent);color:var(--text);}
.preset-btn.active{background:rgba(43,63,158,.2);border-color:var(--accent);color:var(--text);}

/* ── N-BACK ── */

.nb-box.ok{border-color:var(--green);box-shadow:0 0 50px rgba(52,211,153,.4),0 16px 48px rgba(0,0,0,.32);}
.nb-box.err{border-color:var(--red);box-shadow:0 0 50px rgba(248,113,113,.38),0 16px 48px rgba(0,0,0,.32);}
#nb-ltr{font-size:6.5rem;font-weight:800;letter-spacing:-.04em;color:var(--text);transition:opacity .1s,transform .1s;line-height:1;user-select:none;}
#nb-ltr.gone{opacity:0;transform:scale(.78);}
#nb-fb{font-size:13.5px;font-weight:700;height:20px;text-align:center;letter-spacing:.02em;}
#nb-fb.ok{color:var(--green);}#nb-fb.err{color:var(--red);}#nb-fb.miss{color:var(--yellow);}
.nb-btn{width:100%;max-width:340px;background:linear-gradient(135deg,var(--accent),#fb923c);border:none;border-radius:16px;padding:20px;font-family:inherit;font-size:16px;font-weight:700;color:#1c1204;cursor:pointer;transition:all .15s;box-shadow:0 8px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;gap:10px;}
.nb-btn:hover{transform:translateY(-1px);}
.nb-btn:active{transform:scale(.98);}
.nb-btn.pressed{background:linear-gradient(180deg,var(--green),#059669);color:#022c22;}
.nb-oneliner{background:var(--card-hi);border:1.5px solid rgba(96,165,250,.5);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.6;color:var(--text);font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.2);}
.nb-mode-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;font-family:var(--font-display);}
.nb-mode-badge.practice{background:rgba(96,165,250,.2);border:1.5px solid rgba(96,165,250,.6);color:#93c5fd;text-shadow:0 0 10px rgba(96,165,250,.6);}
.nb-mode-badge.real{background:rgba(43,63,158,.18);border:1.5px solid rgba(43,63,158,.55);color:#fdba74;}
.nb-explain{margin-top:16px;padding:16px 18px;background:var(--card-hi);border:1.5px solid var(--border2);border-radius:16px;font-size:14px;line-height:1.6;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.24);text-align:center;max-width:340px;}
.nb-explain.ok{border-color:rgba(52,211,153,.55);}
.nb-explain.err{border-color:rgba(248,113,113,.55);}
.nb-explain-title{font-family:var(--font-display);font-size:15.5px;font-weight:800;margin-bottom:5px;}
.nb-explain.ok .nb-explain-title{color:var(--green);}
.nb-explain.err .nb-explain-title{color:var(--red);}
.nb-summary-ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:6px auto 18px;background:conic-gradient(var(--accent) calc(var(--pct)*1%),rgba(255,255,255,.1) 0);}
.nb-summary-ring-inner{width:96px;height:96px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.key-tag{font-size:10px;background:rgba(0,0,0,.1);border:1px solid rgba(0,0,0,.12);padding:2px 8px;border-radius:4px;font-weight:700;}

/* ── RESULTS ── */
.ring-wrap{position:relative;width:170px;height:170px;margin:14px auto;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-family:var(--font-display);font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.ring-sub{font-size:10.5px;color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.metric{background:var(--card-hi);border:1px solid var(--border2);border-radius:14px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.1);}
.metric.full{grid-column:1/-1;}
.m-lbl{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-bottom:6px;}
.m-val{font-family:var(--font-display);font-size:1.5rem;font-weight:800;}
.m-val.ok{color:var(--green)}.m-val.warn{color:var(--yellow)}.m-val.bad{color:var(--red)}.m-val.acc{color:var(--accent);}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;}
.dot{width:12px;height:12px;border-radius:3px;transition:transform .2s;cursor:pointer;}
.dot:hover{transform:scale(1.5);}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.miss{background:var(--yellow)}.dot.na{background:rgba(255,255,255,.1);}
.dot-leg{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap;}
.dl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);font-weight:600;}
.dl span{width:11px;height:11px;border-radius:2px;display:inline-block;}
.res-block{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card-hi);border:1px solid var(--border2);border-radius:14px;margin-bottom:9px;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.1);}
.res-ico{font-size:28px;line-height:1;}
.res-lbl{font-size:10px;color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.res-val{font-family:var(--font-display);font-size:15.5px;font-weight:700;margin-top:2px;color:var(--text);}
.interp{padding:15px 16px;background:var(--card-hi);border:1px solid rgba(43,63,158,.35);border-radius:14px;font-size:14px;line-height:1.7;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2);}
.explain-box{background:var(--card-hi);border:1.5px solid var(--border2);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.08);}
.explain-box p{line-height:1.78;letter-spacing:.005em;}
.explain-hd{font-family:var(--font-display);font-size:13.5px;font-weight:800;letter-spacing:.02em;color:var(--text);margin-bottom:10px;text-shadow:0 1px 8px rgba(0,0,0,.35);}
.consent-box{display:flex;align-items:flex-start;gap:11px;margin-top:16px;padding:13px 15px;background:var(--card-hi);border:1.5px solid var(--border2);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s;}
.consent-box:hover{border-color:rgba(43,63,158,.4);}
.consent-box span{font-size:13.5px;line-height:1.55;color:var(--text);font-weight:500;}
.consent-cb{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--accent);cursor:pointer;}
.consent-box.shake{animation:shakeX .4s;border-color:rgba(248,113,113,.6);}
@keyframes shakeX{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.qc-block{padding:14px;border:1.5px dashed rgba(96,165,250,.45);border-radius:16px;background:rgba(96,165,250,.06);}

/* ── THANK YOU ── */
.ty-star{font-size:72px;display:block;text-align:center;margin-bottom:12px;animation:starPop .7s cubic-bezier(.34,1.56,.64,1);}
@keyframes starPop{from{transform:scale(0)rotate(-30deg);opacity:0;}to{transform:scale(1)rotate(0);opacity:1;}}
.confetti-row{display:flex;justify-content:center;gap:10px;font-size:26px;margin:14px 0;animation:slideUp .55s .3s cubic-bezier(.34,1.2,.64,1) backwards;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.ty-line{height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);border-radius:12px;margin:18px 0;}
.ty-quote{margin:18px auto;max-width:400px;padding:16px 20px;background:rgba(43,63,158,.08);border:1px solid rgba(43,63,158,.2);border-radius:14px;font-size:14.5px;font-style:italic;color:var(--muted);}
.pid-chip{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:9px 16px;background:var(--card-hi);border:1px solid var(--border2);border-radius:12px;cursor:pointer;transition:background .2s,transform .2s;}
.pid-chip:hover{filter:brightness(1.08);transform:translateY(-1px);}
.pid-chip:active{transform:translateY(0);}
.pid-lbl{font-size:11.5px;color:var(--muted2);font-weight:600;}
.pid-val{font-size:14px;font-weight:800;color:var(--accent);font-family:var(--font-display);letter-spacing:-.01em;}
.pid-copy{font-size:13px;opacity:.75;}

.admin-btn{position:fixed;bottom:14px;right:14px;z-index:300;background:rgba(0,0,0,.4);border:1px solid var(--border);backdrop-filter:blur(20px);border-radius:12px;padding:7px 14px;font-size:11px;color:var(--muted2);cursor:pointer;transition:all .2s;}

  position: static;   /* ✅ no more floating */
  display: block;
  text-align: center;
  margin: 20px auto;
  font-size: 12px;
  color: var(--muted2);
  opacity: .75;
  max-width: 90%;
  line-height: 1.4;
}
.admin-btn:hover{color:var(--text);border-color:var(--border2);}
.admin-tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

td{padding:8px 10px;border-top:1px solid var(--border);color:var(--sub);}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

hr{border:none;border-top:1px solid var(--border);margin:20px 0;}

/* ── CONFETTI CANVAS ── */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000;}

  .contact-bar{flex-direction:column;}
  .contact-chip{flex-basis:auto;width:100%;align-items:flex-start;}
  .toast{white-space:normal;border-radius:18px;width:calc(100vw - 28px);}
  .opt-txt{font-size:14px;}
  .pill-lbl{font-size:14px;}
}

const API_BASE=(()=>{
  const meta=document.querySelector('meta[name="survey-api"]')?.content?.trim();
  if(meta)return meta.replace(/\/$/,'');
  return location.protocol==='file:'?'http://localhost:8787':'';

function apiUrl(path){return API_BASE?API_BASE+path:path;}
function rowKey(r){return 'r:'+(r?.pid||r?.participant_id||('import_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)));}
function addRow(rows,seen,row,key){
  if(!row||typeof row!=='object')return;
  const k=key||rowKey(row);
  if(seen.has(k))return;
  rows.push(row);seen.add(k);
}
function saveLocalRow(row){
  let localOk=false;
  try{
    const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
    ex[rowKey(row)]=JSON.stringify(row);
    localStorage.setItem('tadqiqot',JSON.stringify(ex));
    localOk=true;
  }catch(e){console.warn('local save failed:',e);}
  return localOk;
}
async function postWithRetry(url,body,maxAttempts=3){
  let lastErr=null;
  for(let attempt=1;attempt<=maxAttempts;attempt++){
    try{
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body});
      return res; // got a real HTTP response (even an error status) \u2014 don't retry, that's not a connectivity problem
    }catch(e){
      lastErr=e;
      if(attempt<maxAttempts){
        // Likely caught the server mid-restart (cold start on a free host can take 30-60s to
        // fully come up) \u2014 wait a bit and try again rather than immediately giving up and
        // falling back to local-only storage.
        await new Promise(r=>setTimeout(r,attempt*4000));
      }
    }
  }
  throw lastErr;
}
async function saveData(d){
  let shared=false;
  let assignedPid=d.pid||null;
  try{
    const res=await postWithRetry(apiUrl('/api/responses'),JSON.stringify(d));
    shared=res.ok;
    if(res.ok){
      try{const j=await res.json();if(j&&j.pid)assignedPid=j.pid;}catch(e){}
    }
  }catch(e){console.warn('server save failed after retries:',e);}
  if(!assignedPid){
    // Server unreachable and no id assigned yet \u2014 offline fallback, device-local only.
    try{
      const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
      assignedPid='participant'+(Object.keys(ex).length+1);
    }catch(e){assignedPid='participant'+Date.now();}
  }
  d.pid=assignedPid;
  try{
    if(!shared&&typeof window.storage!=='undefined'&&window.storage){
      await window.storage.set(rowKey(d),JSON.stringify(d),true);
      shared=true;
    }
  }catch(e){console.warn('shared storage set failed:',e);}
  return{shared,local:saveLocalRow(d),pid:assignedPid};
}
async function loadAll(){
  const rows=[];const seen=new Set();
  STORE_STATUS={api:false,apiCount:0,artifact:false,localCount:0};
  try{
    const res=await fetch(apiUrl('/api/responses'),{cache:'no-store'});
    if(res.ok){
      const data=await res.json();
      if(Array.isArray(data)){
        STORE_STATUS.api=true;STORE_STATUS.apiCount=data.length;
        data.forEach(row=>addRow(rows,seen,row,rowKey(row)));
      }
    }
  }catch(e){}
  try{
    if(typeof window.storage!=='undefined'&&window.storage){
      const l=await window.storage.list('r:',true);
      for(const k of(l?.keys||[])){
        try{
          const r=await window.storage.get(k,true);
          if(r?.value){addRow(rows,seen,JSON.parse(r.value),k);STORE_STATUS.artifact=true;}
        }catch(e){}
      }
    }
  }catch(e){}
  try{
    const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
    STORE_STATUS.localCount=Object.keys(ex).length;
    for(const k of Object.keys(ex)){
      try{addRow(rows,seen,JSON.parse(ex[k]),k);}catch(e){}
    }
  }catch(e){}
  rows.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  return rows;
}

const WHEEL_MID=Math.floor(WHEEL_LOOPS/2);
function pad2(n){return String(n).padStart(2,'0');}
function buildWheelItems(list,activeRealIdx){
  const N=list.length;let html='';
  for(let block=0;block<WHEEL_LOOPS;block++){
    list.forEach((v,i)=>{
      const flat=block*N+i;
      const active=block===WHEEL_MID&&i===activeRealIdx;
      html+=`<div class="wheel-item${active?' active':''}" data-idx="${flat}">${pad2(v)}</div>`;
    });
  }
  return html;
}

    <div class="clock-hint">${LANG==='en'?'Scroll or tap to choose — keeps looping':LANG==='ru'?'Прокрутите или нажмите':'Tanlash uchun aylantiring yoki bosing'}</div>
  </div>`;
}
function markWheelActive(wrap,flatIdx){
  wrap.querySelectorAll('.wheel-item').forEach(item=>{
    item.classList.toggle('active',Number(item.dataset.idx)===flatIdx);
  });
}
function initClocks(){
  document.querySelectorAll('.wheel-scroll[data-clock]').forEach(wrap=>{
    if(wrap.dataset.bound)return;
    wrap.dataset.bound='1';
    const id=wrap.dataset.clock,unit=wrap.dataset.unit;
    // Setting scrollTop programmatically still fires a native 'scroll' event. Without this
    // flag, that self-inflicted event gets mistaken for real user scrolling, which marks the
    // wheel "touched" and can trigger auto-advance before the person has touched anything.
    let silent=true;
    // Start centred in the middle loop copy so there's room to scroll both directions.
    // Deferred to the next frame so this never races the page's own scroll-to-top.
    requestAnimationFrame(()=>{
      const cfg=CLOCKS[id];
      if(!cfg)return;
      const list=unit==='h'?cfg.hours:cfg.minutes;
      const cur=unit==='h'?cfg.curH:cfg.curM;
      const realIdx=Math.max(0,list.indexOf(cur));
      wrap.scrollTop=(WHEEL_MID*list.length+realIdx)*WHEEL_ITEM;
      markWheelActive(wrap,WHEEL_MID*list.length+realIdx);
      if(typeof pinTop==='function')pinTop();
      setTimeout(()=>{silent=false;},280);
    });
    let settleTimer=null,rafPending=false;
    wrap.addEventListener('scroll',()=>{
      if(silent)return;
      if(!rafPending){
        rafPending=true;
        requestAnimationFrame(()=>{rafPending=false;updateWheel(id,unit,false);});
      }
      clearTimeout(settleTimer);
      settleTimer=setTimeout(()=>updateWheel(id,unit,true),140);
    },{passive:true});
    wrap.querySelectorAll('.wheel-item').forEach(item=>{
      item.addEventListener('click',()=>{
        silent=false;
        const flat=Number(item.dataset.idx);
        wrap.scrollTo({top:flat*WHEEL_ITEM,behavior:'smooth'});
        clearTimeout(settleTimer);
        settleTimer=setTimeout(()=>updateWheel(id,unit,true),260);
      });
    });
  });
}
function commitClockValue(id,justSettled){
  const cfg=CLOCKS[id];if(!cfg)return;
  const lbl=`${pad2(cfg.curH)}:${pad2(cfg.curM)}`;
  const disp=document.getElementById(id+'_disp');
  if(disp) disp.innerHTML=`${LANG==='en'?'Selected':LANG==='ru'?'Выбрано':'Tanlangan'}: <span>${lbl}</span>`;
  const answerId=cfg.gid||id;
  const container=document.getElementById('g_'+answerId);
  if(container) container.dataset.val=lbl;
  // Only auto-advance to the next question once the person has actually settled on
  // BOTH the hour wheel and the minute wheel at least once, and only the first time —
  // never mid-scroll, so nobody gets yanked away while they're still spinning the wheel.
  if(justSettled&&cfg.hTouched&&cfg.mTouched&&!cfg.advanced){
    cfg.advanced=true;
    setTimeout(()=>{
      const section=container?.closest('.qs-block');
      const next=section?.nextElementSibling;
      if(next){ const top=next.getBoundingClientRect().top+window.scrollY-80; window.scrollTo({top,behavior:'smooth'}); }
    },320);
  }
}
function updateWheel(id,unit,settled){
  const wrap=document.getElementById(id+'_'+unit);
  const cfg=CLOCKS[id];
  if(!wrap||!cfg)return;
  const list=unit==='h'?cfg.hours:cfg.minutes;
  const N=list.length;
  let flat=Math.round(wrap.scrollTop/WHEEL_ITEM);
  flat=Math.max(0,Math.min(N*WHEEL_LOOPS-1,flat));
  const realIdx=((flat%N)+N)%N;
  markWheelActive(wrap,flat);
  if(unit==='h')cfg.curH=list[realIdx];else cfg.curM=list[realIdx];
  if(!settled)return; // live-scroll: just track position, don't snap/commit yet (keeps it smooth, no lag)
  if(Math.abs(wrap.scrollTop-flat*WHEEL_ITEM)>1) wrap.scrollTo({top:flat*WHEEL_ITEM,behavior:'smooth'});
  cfg[unit+'Touched']=true;
  // Recentre into the middle copy of the loop once scrolling settles, so the person
  // always has room to keep spinning past 23→00 or 55→00 in either direction.
  const bandStart=WHEEL_MID*N,bandEnd=bandStart+N-1;
  if(flat<bandStart||flat>bandEnd){
    const targetFlat=bandStart+realIdx;
    setTimeout(()=>{
      wrap.scrollTop=targetFlat*WHEEL_ITEM;
      markWheelActive(wrap,targetFlat);
    },260);
  }
  commitClockValue(id,true);
}
function selectClock(id,hour,minute,gid,autoScroll=true){
  const cfg=CLOCKS[id];if(!cfg)return;
  if(gid) cfg.gid=gid;
  const hIdx=cfg.hours.indexOf(hour),mIdx=cfg.minutes.indexOf(minute);
  if(hIdx>=0)cfg.curH=cfg.hours[hIdx];
  if(mIdx>=0)cfg.curM=cfg.minutes[mIdx];
  // Wheels position themselves centred on first render inside initClocks(); this just
  // primes the starting value silently (no page-scroll) before that happens.
  commitClockValue(id,false);
}

  // The survey takes 5-10+ minutes, and the client makes no server requests during that whole
  // time otherwise \u2014 if the server spins down partway through (free hosting), the FINAL save
  // at the end can hit a sleeping/restarting server and silently fail. This ping, every 4 minutes

  // specifically, regardless of whether the external keep-alive workflow happens to land in
  // this exact window.
  if(PREVIEW_MODE||HEARTBEAT_TIMER)return;

function calcPSQI(){
  const p=S.psqi;
  const c1=p.p6||0;
  const lat=p.q2||0;
  const c2s=lat+(p['5a']||0);const c2=c2s===0?0:c2s<=2?1:c2s<=4?2:3;
  const c3=p.q4||0;
  // C4: sleep efficiency using parsed times
  let c4=0;
  try{
    if(p.q1&&p.q3){
      const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+(m||0);};
      let bed=toMin(p.q1),wake=toMin(p.q3);
      if(wake<=bed)wake+=1440;
      const tib=(wake-bed)/60;
      const actualMap=[4.5,5.5,6.5,7.5];
      const actual=actualMap[p.q4]||7;
      const se=(actual/tib)*100;
      c4=se>=85?0:se>=75?1:se>=65?2:3;
    }
  }catch(e){}
  const c5s=PSQI5.reduce((s,k)=>s+(p['5'+k]||0),0);const c5=c5s===0?0:c5s<=9?1:c5s<=18?2:3;
  const c6=p.p7||0;
  const c7s=(p.p8||0)+(p.p9||0);const c7=c7s===0?0:c7s<=2?1:c7s<=4?2:3;
  return c1+c2+c3+c4+c5+c6+c7;
}

// ═══ N-BACK TASK (guided practice round, then the real scored test) ══════
const LTRS=['B','D','F','G','H','K','L','M','N','P','R','S','T'];
const NB_TOTAL=22,NB_SHOW=2000,NB_BLANK=280;
const NB_PRACTICE_TOTAL=8,NB_PRACTICE_SHOW=2800,NB_PRACTICE_BLANK=350;
let nbSeq=[],nbIdx=0,nbResponded=false,nbStart=0,nbTimer=null,nbRAF=null;
let nbMode='practice',nbPracticeCorrect=0;

// ── N-BACK ENGAGEMENT TRACKING ──────────────────────────────────────────
// The concern this solves: d-prime alone can't tell "genuinely low working memory"
// apart from "wasn't paying attention" — someone who presses nothing the whole way
// through still lands near the low end of the d' scale instead of getting flagged as
// invalid. Rather than touching the task itself (same 2-back rule, same timing, same
// sequence generation as before), this instruments the *real* test run only, using
// signals a script can't fake by accident and a genuinely-engaged participant will
// never trip:
//   1. nbNoResponse   — literally zero button presses across the whole real test.
//   2. nbFadedOut     — responded during the first half, then went completely silent
//                       for the second half (checked out partway rather than at ability).
//   3. nbOverResponse — pressed on ~85%+ of trials, i.e. mashing the button regardless
//                       of the stimulus rather than actually discriminating matches.
//   4. nbDistracted   — the browser tab/window lost focus for a meaningful stretch
//                       during the real test (switched apps/tabs instead of attending).
// These feed into the same qc.excludeRecommended composite the rest of the survey
// already uses — a flag for review, not a silent auto-exclusion.
let nbTrackingActive=false,nbBlurCount=0,nbBlurMs=0,nbBlurSince=null;
function nbMarkUnfocused(){
  if(!nbTrackingActive||nbBlurSince)return;
  nbBlurSince=Date.now();nbBlurCount++;
}
function nbMarkFocused(){
  if(!nbTrackingActive||!nbBlurSince)return;
  nbBlurMs+=Date.now()-nbBlurSince;nbBlurSince=null;
}
document.addEventListener('visibilitychange',()=>{document.hidden?nbMarkUnfocused():nbMarkFocused();});
window.addEventListener('blur',nbMarkUnfocused);
window.addEventListener('focus',nbMarkFocused);
function nbStartTracking(){nbTrackingActive=true;nbBlurCount=0;nbBlurMs=0;nbBlurSince=null;}
function nbStopTracking(){nbMarkFocused();nbTrackingActive=false;}

function genSeq(n){
  const s=[];
  for(let i=0;i<n;i++){
    if(i>=2&&Math.random()<0.34){s.push(s[i-2]);}
    else{let l;do{l=LTRS[Math.floor(Math.random()*LTRS.length)];}while(i>=2&&l===s[i-2]);s.push(l);}
  }return s;
}
function genPracticeSeq(n){
  // Teaching-oriented sequence: guarantees an early, obvious match so the rule "clicks" fast.
  const s=[];
  const forceMatchAt=new Set([2,5]);
  for(let i=0;i<n;i++){
    if(i>=2&&forceMatchAt.has(i)){s.push(s[i-2]);}
    else if(i>=2&&Math.random()<0.28){s.push(s[i-2]);}
    else{let l;do{l=LTRS[Math.floor(Math.random()*LTRS.length)];}while(i>=2&&l===s[i-2]);s.push(l);}
  }return s;
}

  nbMode='practice';nbPracticeCorrect=0;

}

function runTrial(){
  const total=nbMode==='practice'?NB_PRACTICE_TOTAL:NB_TOTAL;
  const show=nbMode==='practice'?NB_PRACTICE_SHOW:NB_SHOW;
  const blank=nbMode==='practice'?NB_PRACTICE_BLANK:NB_BLANK;
  if(nbIdx>=nbSeq.length){
    if(nbMode==='practice'){showPracticeSummary();}else{showFatiguePrompt();}
    return;
  }
  nbResponded=false;
  const ltr=nbSeq[nbIdx];const isM=nbIdx>=2&&ltr===nbSeq[nbIdx-2];
  const lEl=document.getElementById('nb-ltr'),box=document.getElementById('nb-box');
  const fb=document.getElementById('nb-fb'),btn=document.getElementById('nb-btn'),ex=document.getElementById('nb-explain');
  if(!lEl)return;
  box.className='nb-box';fb.textContent='';fb.className='';btn&&btn.classList.remove('pressed');
  if(ex)ex.innerHTML='';
  lEl.classList.add('gone');
  setTimeout(()=>{if(document.getElementById('nb-ltr')){lEl.textContent=ltr;lEl.classList.remove('gone');}},blank);
  document.getElementById('nb-cnt').textContent=(nbIdx+1)+'/'+total;
  document.getElementById('nb-fill').style.width=((nbIdx/total)*100)+'%';
  nbStart=performance.now();startTimerAnim(show);clearTimeout(nbTimer);
  nbTimer=setTimeout(()=>{
    stopTimerAnim();
    if(!nbResponded){
      if(nbMode==='real'){
        S.nback.trials.push({ltr,isM,responded:false,correct:!isM,rt:null});
        if(isM){const f=document.getElementById('nb-fb');if(f){f.textContent=t('nb_miss');f.className='miss';}}
      }else{
        if(!isM)nbPracticeCorrect++; // correctly withheld on a non-match
        showPracticeExplain(isM,false,ltr);
      }
    }
    const le=document.getElementById('nb-ltr');if(le)le.classList.add('gone');
    if(nbMode==='real'){nbIdx++;setTimeout(runTrial,blank);}
    // Practice mode never auto-advances — it waits for the person to tap "Continue"
    // after reading the explanation, so nobody gets rushed while still learning the rule.
  },show);
}
function startTimerAnim(show){
  const el=document.getElementById('nb-tmr');const t0=Date.now();stopTimerAnim();
  function tick(){const r=Math.max(0,(show-(Date.now()-t0))/1000);if(el)el.textContent=r.toFixed(1)+'s';if(r>0)nbRAF=requestAnimationFrame(tick);}
  nbRAF=requestAnimationFrame(tick);
}
function stopTimerAnim(){if(nbRAF)cancelAnimationFrame(nbRAF);}
function nbPress(){
  if(nbResponded||nbIdx>=nbSeq.length)return;
  nbResponded=true;
  const rt=Math.round(performance.now()-nbStart),ltr=nbSeq[nbIdx],isM=nbIdx>=2&&ltr===nbSeq[nbIdx-2];
  const box=document.getElementById('nb-box'),fb=document.getElementById('nb-fb'),btn=document.getElementById('nb-btn');
  btn&&btn.classList.add('pressed');
  if(nbMode==='real'){
    S.nback.trials.push({ltr,isM,responded:true,correct:isM,rt});
    if(isM){box&&(box.className='nb-box ok');if(fb){fb.textContent=t('nb_ok');fb.className='ok';}}

// ═══ SIGNAL DETECTION (d-prime, criterion c) ════════════════════════════
function erfc(x){
  // Numerical Recipes erfc approximation, |error| < 1.2e-7
  const z=Math.abs(x);
  const t=1/(1+z/2);
  const ans=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+
    t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));
  return x>=0?ans:2-ans;
}
function probit(p){
  // Peter Acklam's high-precision inverse normal CDF (~1.15e-9 relative error),
  // refined with one step of Halley's rational method for extra accuracy.
  if(p<=0)return-8.2;if(p>=1)return 8.2;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const plow=0.02425,phigh=1-plow;
  let q,r,x;
  if(p<plow){
    q=Math.sqrt(-2*Math.log(p));
    x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }else if(p<=phigh){
    q=p-0.5;r=q*q;
    x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }else{
    q=Math.sqrt(-2*Math.log(1-p));
    x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  const e=0.5*erfc(-x/Math.SQRT2)-p;
  const u=e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2);
  x=x-u/(1+x*u/2);
  return x;
}
function nbStats(trials){
  const tgt=trials.filter(x=>x.isM);
  const ntgt=trials.filter(x=>!x.isM);
  const nT=tgt.length,nNT=ntgt.length;
  if(!nT||!nNT)return{dprime:null,bias:null,acc:0,hits:0,misses:0,fa:0,cr:0,meanRT:null,medRT:null};
  const hits=tgt.filter(x=>x.responded).length;
  const misses=nT-hits;
  const fa=ntgt.filter(x=>x.responded).length;
  const cr=nNT-fa;
  // Edge correction (Hautus, 1995)
  const HR=hits===0?.5/nT:hits===nT?1-.5/nT:hits/nT;
  const FAR=fa===0?.5/nNT:fa===nNT?1-.5/nNT:fa/nNT;
  const zH=probit(HR),zF=probit(FAR);
  const dprime=Math.round((zH-zF)*1000)/1000;
  const bias=Math.round((-0.5*(zH+zF))*1000)/1000; // criterion c (positive=conservative)
  // Overall accuracy (correct responses / total)
  const acc=Math.round(((hits+cr)/trials.length)*100);
  // Hit rate accuracy (hits / targets, for display)
  const hitAcc=Math.round((hits/nT)*100);
  // RT: hits only (correct responses to targets), ms
  const rts=tgt.filter(x=>x.responded&&x.rt).map(x=>x.rt);
  let meanRT=null,medRT=null;
  if(rts.length){
    meanRT=Math.round(rts.reduce((a,b)=>a+b,0)/rts.length);
    const sorted=[...rts].sort((a,b)=>a-b);
    medRT=rts.length%2===0?(sorted[rts.length/2-1]+sorted[rts.length/2])/2:sorted[Math.floor(rts.length/2)];
    medRT=Math.round(medRT);
  }
  // RT floor check: a response under ~150ms is physiologically too fast to be a genuine
  // reaction to the stimulus (human simple-RT floor) \u2014 almost certainly anticipatory/mashed.
  const allRespondedRTs=trials.filter(x=>x.responded&&x.rt!=null).map(x=>x.rt);
  const anticipatory=allRespondedRTs.filter(rt=>rt<150).length;
  return{dprime,bias,acc,hitAcc,hits,misses,fa,cr,meanRT,medRT,nT,nNT,anticipatory};
}


function getSessionMeta(){
  let device='desktop';
  const ua=navigator.userAgent||'';
  if(/Mobi|Android(?!.*Tablet)|iPhone/i.test(ua))device='mobile';
  else if(/iPad|Tablet|Android/i.test(ua))device='tablet';
  let browser='other';
  if(/Edg\//.test(ua))browser='edge';
  else if(/Chrome\//.test(ua)&&!/Chromium/.test(ua))browser='chrome';
  else if(/Firefox\//.test(ua))browser='firefox';
  else if(/Safari\//.test(ua)&&!/Chrome/.test(ua))browser='safari';
  return {
    device,browser,
    screenW:window.screen?window.screen.width:null,
    screenH:window.screen?window.screen.height:null,
    viewportW:window.innerWidth,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone||null
  };
}
function timeInBedHours(bedtime,waketime){
  // bedtime/waketime are "HH:MM" strings; handles overnight wraparound (e.g. 23:00 -> 07:00).
  if(!bedtime||!waketime)return null;
  const [bh,bm]=bedtime.split(':').map(Number),[wh,wm]=waketime.split(':').map(Number);
  if([bh,bm,wh,wm].some(isNaN))return null;
  let bed=bh*60+bm,wake=wh*60+wm;
  if(wake<=bed)wake+=24*60; // crossed midnight
  return (wake-bed)/60;
}

function submitFatigue(rating){
  if(SUBMITTING_NBACK)return; // ignore every click after the first \u2014 no double/triple/30x submits
  SUBMITTING_NBACK=true;
  // Instant visual feedback so it never looks like the tap did nothing, even while the save is still in flight.
  const opts=document.getElementById('fatigue-opts');
  if(opts)opts.style.pointerEvents='none';
  const chosen=document.getElementById('fatigue-opt-'+rating);
  if(chosen)chosen.classList.add('selected');
  document.querySelectorAll('#fatigue-opts .opt').forEach(el=>{if(el!==chosen)el.style.opacity='.35';});
  const icon=document.getElementById('fatigue-icon');
  if(icon)icon.textContent='⏳';
  const sub=document.getElementById('fatigue-sub');
  if(sub)sub.textContent=LANG==='en'?'Saving your results\u2026':LANG==='ru'?'Сохраняем результаты\u2026':'Natijalar saqlanmoqda\u2026';
  finishNback(rating);
}
async function finishNback(fatigue){
  SUBMITTING_NBACK=true; // idempotent safety net in case this is ever called directly
  stopTimerAnim();
  const stats=nbStats(S.nback.trials);
  S.nback={...S.nback,...stats,trials:S.nback.trials};
  const durSec=Math.round((Date.now()-S.t0)/1000);
  const psqi5=['5a','5b','5c','5d','5e','5f','5g','5h','5i'];
  const psqi5vals=psqi5.map(k=>S.psqi[k]).filter(v=>v!==undefined&&v!==null);
  const straightLine=psqi5vals.length===9&&new Set(psqi5vals).size===1;
  const tib=timeInBedHours(S.psqi.q1,S.psqi.q3);
  const durBandMin=[0,5,6,7][S.psqi.q4]??null; // hours implied by the selected duration band
  const timeInconsistent=(tib!==null&&durBandMin!==null)?(tib<durBandMin-0.75):false; // can't have slept more than time in bed
  const nT=S.nback.trials.filter(x=>x.isM).length,nNT=S.nback.trials.filter(x=>!x.isM).length;
  const targetRatio=S.nback.trials.length?Math.round((nT/S.nback.trials.length)*100)/100:null;
  // Engagement checks — see the block above genSeq() for why these exist and what each one means.
  const totalTrialsN=S.nback.trials.length;
  const respondedTotal=stats.hits+stats.fa;
  const responseRate=totalTrialsN?Math.round((respondedTotal/totalTrialsN)*1000)/1000:null;
  const nbNoResponse=totalTrialsN>0&&respondedTotal===0;
  const half=Math.floor(totalTrialsN/2);
  const firstHalfResp=S.nback.trials.slice(0,half).filter(x=>x.responded).length;
  const secondHalfResp=S.nback.trials.slice(half).filter(x=>x.responded).length;
  const nbFadedOut=half>=4&&firstHalfResp>=2&&secondHalfResp===0; // engaged early, then went totally silent
  const nbOverResponse=totalTrialsN>0&&(respondedTotal/totalTrialsN)>=0.85; // pressing almost everything, matches or not
  const nbDistracted=nbBlurCount>0&&nbBlurMs>=2000; // tab/window unfocused for 2s+ during the real test
  // RT-variance check: hits with almost zero variance in reaction time across 4+ presses is a
  // pattern genuine human reflexes essentially never produce \u2014 scripted/robotic responding does.
  const hitRTs=S.nback.trials.filter(x=>x.isM&&x.responded&&x.rt!=null).map(x=>x.rt);
  let nbRTFlat=false;
  if(hitRTs.length>=4){
    const mean=hitRTs.reduce((a,b)=>a+b,0)/hitRTs.length;
    const variance=hitRTs.reduce((a,b)=>a+(b-mean)*(b-mean),0)/hitRTs.length;
    nbRTFlat=Math.sqrt(variance)<20;
  }
  // Honeypot: a real person never sees or fills this field; a script that blindly fills every
  // input on the page does.
  const hpEl=document.getElementById('hp_website');
  const honeypotTripped=!!(hpEl&&hpEl.value&&hpEl.value.trim()!=='');
  // Instant-first-click: a human needs at least a brief moment to read the intro before
  // tapping anything; near-zero time to first interaction suggests an automated script.
  const instantFirstClick=firstInteractionMs!==null&&firstInteractionMs<400;
  const fingerprint=await computeFingerprint();
  const qc={
    attnPass:!!(S.qc&&S.qc.attnPass),
    attnAnswered:!!(S.qc&&S.qc.attnAnswered),
    attnPass2:!!(S.qc&&S.qc.attnPass2), // second, differently-worded instructed-response check (mid-survey)
    attnAnswered2:!!(S.qc&&S.qc.attnAnswered2),
    fast:durSec<180, // under 3 minutes for a ~15-20 min survey is almost certainly rushed
    anticipatory:stats.anticipatory>=2, // 2+ sub-150ms presses \u2014 near-impossible as genuine reactions
    straightLine, // identical answer on all 9 PSQI disturbance sub-items \u2014 classic satisficing pattern
    timeInconsistent, // reported more sleep than time spent in bed \u2014 logically impossible
    nbNoResponse, // zero button presses across the entire real n-back test
    nbFadedOut, // responded early on, then went silent for the whole second half
    nbOverResponse, // pressed on ~85%+ of trials \u2014 button-mashing, not discriminating
    nbDistracted, // tab/window lost focus for 2s+ during the real n-back test
    nbBlurCount, // how many times focus was lost during the real n-back test
    nbBlurMs, // total ms unfocused during the real n-back test
    nbRTFlat, // near-zero variance in n-back hit reaction times \u2014 suggests scripted responses
    honeypotTripped, // hidden field got filled in \u2014 near-certain sign of a bot/script
    instantFirstClick, // first click landed <400ms after page load \u2014 no time for a human to read
    firstInteractionMs, // raw ms from load to first click, for review
    fatigue:fatigue??null // 1\u20135 self-reported task difficulty/fatigue
  };
  qc.excludeRecommended=qc.fast||qc.anticipatory||qc.straightLine||qc.timeInconsistent||!qc.attnPass

// ═══ CONFETTI ════════════════════════════════════════════════════════════
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const particles=[];
  const colors=['#f97316','#6366f1','#38bdf8','#fbbf24','#f87171','#a78bfa','#34d399','#fb923c'];
  for(let i=0;i<160;i++){
    const angle=(Math.random()*360)*Math.PI/180;
    const speed=Math.random()*8+3;
    particles.push({
      x:Math.random()*canvas.width,y:-20,
      vx:(Math.random()-.5)*3,vy:Math.random()*5+2,
      r:Math.random()*7+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,rSpeed:(Math.random()-.5)*8,
      shape:Math.random()<.5?'rect':'circle',
      alpha:1,gravity:.12
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    for(const p of particles){
      p.vy+=p.gravity;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rSpeed;p.alpha-=0.006;
      if(p.alpha>0&&p.y<canvas.height+20){
        alive=true;
        ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);
        ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle=p.color;
        if(p.shape==='rect'){ctx.fillRect(-p.r/2,-p.r/1.5,p.r,p.r*1.3);}
        else{ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}
        ctx.restore();
      }
    }
    if(alive&&frame<360){frame++;requestAnimationFrame(draw);}
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

async function sha256Hex(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// ── DEVICE FINGERPRINT ── one more signal (paired server-side with a hashed IP) to flag
// likely repeat-participation \u2014 e.g. someone retaking the survey in a fresh incognito
// window after localStorage blocked a normal repeat attempt. Only a hash is ever sent or
// stored, never the raw values, and it's a review flag, not an automatic block.
async function computeFingerprint(){
  try{
    const parts=[
      navigator.userAgent||'',navigator.language||'',String(navigator.hardwareConcurrency||''),
      `${screen.width}x${screen.height}x${screen.colorDepth}`,
      (Intl.DateTimeFormat().resolvedOptions().timeZone)||'',
      String(navigator.maxTouchPoints||0)
    ];
    try{
      const c=document.createElement('canvas');c.width=200;c.height=40;
      const ctx=c.getContext('2d');
      if(ctx){ctx.textBaseline='top';ctx.font='14px Arial';ctx.fillText('svy-fp-8825 \u00e9\u00e7\u00f1',2,2);parts.push(c.toDataURL());}
    }catch(e){}
    return await sha256Hex(parts.join('||'));
  }catch(e){return null;}
}

function renderCeilingFloorHtml(rows){

async function setSampleTarget(){
  const cur=await getSampleTarget();
  const v=prompt((LANG==='en'?'Target number of participants (e.g. from a power analysis):':LANG==='ru'?'Целевое число участников (напр., из анализа мощности):':"Ishtirokchilar maqsadli soni (masalan, power analysis asosida):"),cur);
  if(v===null)return;
  const n=parseInt(v,10);
  if(!n||n<1){toast('⚠️ '+(LANG==='en'?'Enter a valid number':'Noto\u2018g\u2018ri son'),'var(--yellow)');return;}
  let savedToServer=false;
  try{
    const res=await fetch(apiUrl('/api/target'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:n})});
    savedToServer=res.ok;
  }catch(e){}
  if(!savedToServer){
    toast('⚠️ '+(LANG==='en'?'Could not reach the server \u2014 saved on this device only':LANG==='ru'?'Сервер недоступен \u2014 сохранено только на этом устройстве':'Serverga ulanmadi \u2014 faqat shu qurilmada saqlandi'),'var(--yellow)');
  }
  try{localStorage.setItem('tadqiqot_target',String(n));}catch(e){}
  renderAdmin();
}
function renderSampleTargetHtml(count,target){
  const pct=Math.min(100,Math.round((count/target)*100));
  return `<p style="margin-bottom:10px;">${count} / ${target} (${pct}%)${pct>=100?' ✅':''}</p>
    <div style="height:10px;background:var(--card-hi);border:2px solid var(--border2);border-radius:6px;overflow:hidden;margin-bottom:12px;">
      <div style="height:100%;width:${pct}%;background:var(--accent);"></div>
    </div>
    <button class="btn btn-ghost" style="padding:9px 16px;font-size:12.5px;" onclick="setSampleTarget()">${LANG==='en'?'Set target':LANG==='ru'?'Задать цель':"Maqsadni belgilash"}</button>
    <p class="muted2" style="margin-top:10px;">${LANG==='en'?'Tip: use a power analysis (e.g. G*Power) for your mediation model to pick a defensible target rather than a round number.':LANG==='ru'?'Совет: используйте анализ мощности (напр., G*Power), чтобы обосновать целевое число.':"Maslahat: G*Power kabi vositalar bilan power analysis qilib, asoslangan maqsad sonini tanlang."}</p>`;
}
function renderScatterSVG(rows){
  const pts=rows.map(r=>({
    x:r.psqi?.global,
    y:r.nback?.dprime,
    mig:!!r.migraine?.likely
  })).filter(p=>typeof p.x==='number'&&typeof p.y==='number'&&!isNaN(p.x)&&!isNaN(p.y));
  if(pts.length<3)return `<p class="muted2">${LANG==='en'?'Not enough complete rows yet to chart.':"Ko'rsatish uchun yetarli ma'lumot yo'q."}</p>`;
  const W=320,H=220,ML=34,MB=28,MT=10,MR=10;
  const xMin=0,xMax=21;
  let yMin=Math.min(-1,...pts.map(p=>p.y)),yMax=Math.max(4,...pts.map(p=>p.y));
  yMin=Math.floor(yMin*10)/10;yMax=Math.ceil(yMax*10)/10;
  const xs=x=>ML+((x-xMin)/(xMax-xMin))*(W-ML-MR);
  const ys=y=>H-MB-((y-yMin)/(yMax-yMin))*(H-MB-MT);
  const dots=pts.map(p=>`<circle cx="${xs(p.x).toFixed(1)}" cy="${ys(p.y).toFixed(1)}" r="4.5" fill="${p.mig?'var(--accent)':'var(--accent2)'}" fill-opacity=".8" stroke="var(--bg)" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:360px;display:block;margin:0 auto;">
    <line x1="${ML}" y1="${H-MB}" x2="${W-MR}" y2="${H-MB}" stroke="var(--border2)" stroke-width="1.5"/>
    <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H-MB}" stroke="var(--border2)" stroke-width="1.5"/>
    <text x="${(ML+W-MR)/2}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--muted2)" font-family="Inter,sans-serif">PSQI global (0\u201321)</text>
    <text x="10" y="${(MT+H-MB)/2}" text-anchor="middle" font-size="9" fill="var(--muted2)" font-family="Inter,sans-serif" transform="rotate(-90 10 ${(MT+H-MB)/2})">d\u2032</text>
    ${dots}
    <circle cx="${W-90}" cy="14" r="4" fill="var(--accent)"/><text x="${W-82}" y="17" font-size="8.5" fill="var(--muted)" font-family="Inter,sans-serif">${LANG==='en'?'migraine likely':'migren ehtimoli'}</text>
  </svg>`;
}

      if(k==='qc_straight_lining_flag')return `<td>${v?'⚠️ '+(LANG==='en'?'Straight-lined':LANG==='ru'?'Одинаковые':'Bir xil javob'):'✅'}</td>`;
      if(k==='qc_nb_no_response_flag')return `<td>${v?'🚫 '+(LANG==='en'?'No response':LANG==='ru'?'Нет ответов':'Javob yo\u2018q'):'✅'}</td>`;
      if(k==='qc_nb_faded_out_flag')return `<td>${v?'⚠️ '+(LANG==='en'?'Faded out':LANG==='ru'?'Затих':'So\u2018ndi'):'✅'}</td>`;
      if(k==='qc_nb_distracted_flag')return `<td>${v?'⚠️ '+(LANG==='en'?'Tab-switched':LANG==='ru'?'Переключился':'Boshqa oynaga o\u2018tdi'):'✅'}</td>`;
      if(k==='qc_nb_rt_flat_flag')return `<td>${v?'⚠️ '+(LANG==='en'?'Flat RT':LANG==='ru'?'Плоское ВР':'Bir xil RT'):'✅'}</td>`;
      if(k==='qc_honeypot_flag')return `<td>${v?'🤖 '+(LANG==='en'?'BOT':LANG==='ru'?'БОТ':'BOT'):'✅'}</td>`;
      if(k==='qc_instant_click_flag')return `<td>${v?'⚡ '+(LANG==='en'?'Instant click':LANG==='ru'?'Мгновенный клик':'Zudlik bilan bosildi'):'✅'}</td>`;
      if(k==='qc_duplicate_suspect_flag')return `<td>${v?'👥 '+(LANG==='en'?'Possible repeat':LANG==='ru'?'Возможен повтор':"Ehtimol qayta"):'✅'}</td>`;

async function deleteParticipant(pid,dateFallback){
  // Some legacy/imported rows may be missing a clean pid \u2014 fall back to matching by
  // the exact save timestamp so every row on screen is still deletable.
  const identity=pid||dateFallback;
  if(!identity){toast('⚠️ '+(LANG==='en'?'Could not identify this row':'Bu qatorni aniqlab bo\u2018lmadi'),'var(--red)');return;}
  const label=pid||(LANG==='en'?'this row':'bu qator');
  if(!confirm((LANG==='en'?'Delete participant':'Ishtirokchini o\u2018chirish')+' "'+label+'"? '+(LANG==='en'?'This cannot be undone.':'Buni bekor qilib bo\u2018lmaydi.')))return;
  let serverConfirmed=false,serverReachable=false;
  try{
    const res=await fetch(apiUrl('/api/responses/'+encodeURIComponent(identity)),{method:'DELETE'});
    serverReachable=true;
    if(res.ok){
      const j=await res.json().catch(()=>null);
      serverConfirmed=!!(j&&j.removed>0);
    }
  }catch(e){console.warn('server delete failed:',e);}
  try{
    const ex=JSON.parse(localStorage.getItem('tadqiqot')||'{}');
    for(const k of Object.keys(ex)){
      try{
        const r=JSON.parse(ex[k]);
        const rid=String(r.pid||r.participant_id||''),rdate=String(r.date||'');
        if(rid===String(identity)||rdate===String(identity))delete ex[k];
      }catch(e){}
    }
    localStorage.setItem('tadqiqot',JSON.stringify(ex));
  }catch(e){}
  try{
    if(typeof window.storage!=='undefined'&&window.storage){
      const l=await window.storage.list('r:',true);
      for(const k of(l?.keys||[])){
        try{
          const r=await window.storage.get(k,true);
          if(r?.value){
            const parsed=JSON.parse(r.value);
            const rid=String(parsed.pid||parsed.participant_id||''),rdate=String(parsed.date||'');
            if(rid===String(identity)||rdate===String(identity))await window.storage.delete(k,true);
          }
        }catch(e){}
      }
    }
  }catch(e){}
  if(STORE_STATUS.api&&serverReachable&&!serverConfirmed){
    toast('⚠️ '+(LANG==='en'?'Server did not confirm deletion \u2014 check the collector is running and try again':'Server o\u2018chirishni tasdiqlamadi \u2014 qayta urinib ko\u2018ring'),'var(--yellow)');
  }else if(STORE_STATUS.api&&!serverReachable){
    toast('⚠️ '+(LANG==='en'?'Could not reach the collector server \u2014 removed locally only':'Serverga ulanib bo\u2018lmadi'),'var(--yellow)');
  }else{
    toast('🗑 '+(LANG==='en'?'Deleted':'O\u2018chirildi')+' '+label,'var(--green)');
  }
  await renderAdmin();
}
function importedRowsFromJSON(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.responses))return data.responses;
  if(data&&typeof data==='object'){
    return Object.values(data).map(v=>{
      if(typeof v==='string'){try{return JSON.parse(v);}catch(e){return null;}}
      return v;
    }).filter(v=>v&&typeof v==='object');
  }
  return[];
}
async function importJSON(file){
  if(!file)return;
  try{
    const rows=importedRowsFromJSON(JSON.parse(await file.text()));
    let count=0;
    for(const row of rows){
      if(!row||typeof row!=='object')continue;
      if(!row.pid&&row.participant_id)row.pid=row.participant_id;
      await saveData(row);count++;
    }
    toast(`Imported ${count} rows`,count?'var(--green)':'var(--yellow)');
    await renderAdmin();
  }catch(e){toast('Import failed: '+e.message,'var(--red)');}
}
