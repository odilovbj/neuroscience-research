name: Keep Server Awake

# Pings the live site every 13 minutes, but ONLY during 9am-10pm Tashkent
# time (UTC+5) — i.e. 4:00-16:59 UTC. This is a deliberate tradeoff:
#
# Pinging 24/7 often enough to reliably beat Render's 15-minute spin-down
# window uses more minutes per month than GitHub Actions' free tier allows
# on a private repo (2,000 min/month) — the math genuinely doesn't fit at
# any interval under ~22 minutes, and 22 minutes is too slow to prevent
# spin-down at all. So instead this keeps the server warm during the hours
# real participants are actually likely to be taking the survey, and
# accepts the ~30-60 second cold-start delay outside that window as a
# reasonable tradeoff for staying within the free tier.
#
# If participants are consistently active outside 9am-10pm local time,
# adjust the hour range below (remember: GitHub Actions cron is always UTC).
# The permanent fix that removes this tradeoff entirely is upgrading Render
# to a paid instance type (~$7/month), which removes spin-down altogether.
on:
  schedule:
    - cron: '*/13 4-16 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: |
          URL="https://neuroscienceresearch.onrender.com/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Pinged $URL -> HTTP $HTTP_CODE"
